name: CATFLIX TMDB Gercek Afisler
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  posters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p posters
          cat << 'EOF' > tmdb_sync.py
          import urllib.request, json

          API_KEY = "4ef0be86342c15f9d510aef2774dfe78"
          HDR = {"User-Agent": "Mozilla/5.0"}

          def get_tmdb(path):
              sep = "&" if "?" in path else "?"
              url = "https://themoviedb.org" + path + sep + "api_key=" + API_KEY + "&language=tr-TR"
              req = urllib.request.Request(url, headers=HDR)
              return json.loads(urllib.request.urlopen(req, timeout=20).read().decode()).get("results", [])[:12]

          def save_img(tmdb_path, local_name):
              if not tmdb_path:
                  return ""
              img_url = "https://tmdb.org" + tmdb_path
              req = urllib.request.Request(img_url, headers=HDR)
              open("posters/" + local_name, "wb").write(urllib.request.urlopen(req, timeout=20).read())
              return local_name

          cats = {
              "trending": get_tmdb("/trending/all/week"),
              "movies": get_tmdb("/movie/popular"),
              "tv": get_tmdb("/tv/popular"),
              "anime": get_tmdb("/discover/tv?with_genres=16&with_original_language=ja&sort_by=popularity.desc")
          }

          out = {"trending": [], "movies": [], "tv": [], "anime": []}
          counter = 1
          for cname, items in cats.items():
              for it in items:
                  p_file = save_img(it.get("poster_path"), f"tmdb_{counter}.jpg")
                  b_file = save_img(it.get("backdrop_path"), f"tmdb_bg_{counter}.jpg")
                  if p_file:
                      out[cname].append({
                          "id": counter,
                          "title": it.get("title") or it.get("name") or "",
                          "vote_average": round(float(it.get("vote_average") or 8.0), 1),
                          "overview": it.get("overview") or "Türkçe özet bilgisi.",
                          "img": "./posters/" + p_file,
                          "bg": "./posters/" + (b_file or p_file)
                      })
                      counter += 1

          open("catalog.json", "w", encoding="utf-8").write(json.dumps(out, ensure_ascii=False))
          EOF
          python3 tmdb_sync.py
          git config user.name "Bot"
          git config user.email "bot@catflix.local"
          git add posters catalog.json
          git commit -m "tmdb_gercek_afisler" || exit 0
          git push

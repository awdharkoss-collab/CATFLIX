name: CATFLIX Gercek Afisler
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  posters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p posters
          curl -sSL "https://yts.mx" -o m1.json
          curl -sSL "https://yts.mx" -o m2.json
          curl -sSL "https://jikan.moe" -o anime.json
          cat << 'EOF' > make_cat.py
          import json, subprocess

          def load_j(fn):
              try: return json.load(open(fn, encoding="utf-8"))
              except: return {}

          def dl(url, name):
              if not url: return ""
              subprocess.run(["curl", "-sSL", url, "-o", "posters/" + name])
              return "./posters/" + name

          m1 = ((load_j("m1.json").get("data") or {}).get("movies")) or []
          m2 = ((load_j("m2.json").get("data") or {}).get("movies")) or []
          animes = (load_j("anime.json").get("data")) or []

          out = {"trending": [], "movies": [], "tv": [], "anime": []}
          idx = 1

          for m in m1[:10]:
              img = dl(m.get("medium_cover_image") or m.get("large_cover_image"), f"real_{idx}.jpg")
              bg = dl(m.get("background_image_original") or m.get("large_cover_image"), f"real_bg_{idx}.jpg")
              out["trending"].append({"id": idx, "title": m.get("title", ""), "vote_average": m.get("rating", 8.2), "overview": m.get("summary") or "Popüler sinema filmi.", "img": img, "bg": bg or img})
              idx += 1

          for m in m2[:12]:
              img = dl(m.get("medium_cover_image") or m.get("large_cover_image"), f"real_{idx}.jpg")
              out["movies"].append({"id": idx, "title": m.get("title", ""), "vote_average": m.get("rating", 8.5), "overview": m.get("summary") or "Yüksek puanlı film.", "img": img, "bg": img})
              idx += 1

          for m in m1[10:20]:
              img = dl(m.get("medium_cover_image") or m.get("large_cover_image"), f"real_{idx}.jpg")
              out["tv"].append({"id": idx, "title": m.get("title", ""), "vote_average": m.get("rating", 8.1), "overview": m.get("summary") or "Öne çıkan yapım.", "img": img, "bg": img})
              idx += 1

          for a in animes[:12]:
              u = ((a.get("images") or {}).get("jpg") or {}).get("large_image_url") or ""
              img = dl(u, f"real_{idx}.jpg")
              out["anime"].append({"id": idx, "title": a.get("title_english") or a.get("title", ""), "vote_average": a.get("score") or 8.6, "overview": a.get("synopsis") or "Popüler anime.", "img": img, "bg": img})
              idx += 1

          open("catalog.json", "w", encoding="utf-8").write(json.dumps(out, ensure_ascii=False))
          EOF
          python3 make_cat.py
          git config user.name "Bot"
          git config user.email "bot@catflix.local"
          git add posters catalog.json
          git commit -m "gercek_afis_paketi" || exit 0
          git push

name: CATFLIX Gercek Afisler
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  posters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p posters
          python3 -c '
          import urllib.request
          imgs = {
              "1.jpg": "https://unsplash.com",
              "2.jpg": "https://unsplash.com",
              "3.jpg": "https://unsplash.com",
              "4.jpg": "https://unsplash.com",
              "5.jpg": "https://unsplash.com",
              "6.jpg": "https://unsplash.com",
              "7.jpg": "https://unsplash.com",
              "8.jpg": "https://unsplash.com",
              "9.jpg": "https://unsplash.com",
              "10.jpg": "https://unsplash.com"
          }
          for name, url in imgs.items():
              urllib.request.urlretrieve(url, "posters/" + name)
          '
          git config user.name "Bot"
          git config user.email "bot@catflix.local"
          git add posters
          git commit -m "yerel_afisler" || exit 0
          git push

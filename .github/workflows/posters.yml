name: CATFLIX Tam Katalog ve TV
on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build_catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p posters
          curl -sSL "https://github.io" -o tr_channels.m3u
          cat << 'EOF' > sync_all.py
          import urllib.request, urllib.parse, json, re, subprocess

          API_KEY = "4ef0be86342c15f9d510aef2774dfe78"

          def fetch_tmdb(endpoint):
              sep = "&" if "?" in endpoint else "?"
              target = f"https://themoviedb.org{endpoint}{sep}api_key={API_KEY}&language=tr-TR"
              for url in [
                  target,
                  "https://allorigins.win" + urllib.parse.quote(target, safe=""),
                  "https://codetabs.com" + urllib.parse.quote(target, safe="")
              ]:
                  try:
                      out = subprocess.check_output(["curl", "-sSL", "-A", "Mozilla/5.0", "--max-time", "15", url]).decode("utf-8", "ignore")
                      data = json.loads(out)
                      if data.get("results"):
                          return data["results"][:18]
                  except:
                      pass
              return []

          def download_img(path, fname):
              if not path:
                  return ""
              for base in ["https://tmdb.org", "https://wsrv.nl/?url=https://tmdb.org"]:
                  try:
                      subprocess.run(["curl", "-sSL", "-A", "Mozilla/5.0", "--max-time", "12", base + path, "-o", "posters/" + fname], check=True)
                      if open("posters/" + fname, "rb").read(4)[:2] in [b"\xff\xd8", b"\x89P"]:
                          return "./posters/" + fname
                  except:
                      pass
              return ""

          sections = {
              "trending": fetch_tmdb("/trending/all/week"),
              "movies": fetch_tmdb("/movie/popular"),
              "top_movies": fetch_tmdb("/movie/top_rated"),
              "tv": fetch_tmdb("/tv/popular"),
              "top_tv": fetch_tmdb("/tv/top_rated"),
              "anime": fetch_tmdb("/discover/tv?with_genres=16&with_original_language=ja&sort_by=popularity.desc"),
              "action": fetch_tmdb("/discover/movie?with_genres=28&sort_by=popularity.desc"),
              "scifi": fetch_tmdb("/discover/movie?with_genres=878&sort_by=popularity.desc")
          }

          catalog = {}
          idx = 1
          for sec, items in sections.items():
              catalog[sec] = []
              for it in items:
                  p_local = download_img(it.get("poster_path"), f"p_{idx}.jpg")
                  b_local = download_img(it.get("backdrop_path"), f"b_{idx}.jpg")
                  if p_local:
                      catalog[sec].append({
                          "id": idx,
                          "title": it.get("title") or it.get("name") or "",
                          "year": (it.get("release_date") or it.get("first_air_date") or "")[:4],
                          "vote": round(float(it.get("vote_average") or 8.0), 1),
                          "overview": it.get("overview") or "Türkçe özet bilgisi.",
                          "poster": p_local,
                          "backdrop": b_local or p_local
                      })
                      idx += 1

          channels = []
          if open("tr_channels.m3u", encoding="utf-8", errors="ignore"):
              lines = open("tr_channels.m3u", encoding="utf-8", errors="ignore").read().splitlines()
              cur_name, cur_logo = "", ""
              for line in lines:
                  if line.startswith("#EXTINF:"):
                      m_logo = re.search(r'tvg-logo="([^"]*)"', line)
                      cur_logo = m_logo.group(1) if m_logo else ""
                      cur_name = line.split(",")[-1].strip()
                  elif line.startswith("http") and cur_name:
                      channels.append({"name": cur_name, "logo": cur_logo, "url": line.strip()})
                      cur_name = ""

          catalog["channels"] = channels[:250]
          open("catalog.json", "w", encoding="utf-8").write(json.dumps(catalog, ensure_ascii=False))
          EOF
          python3 sync_all.py
          git config user.name "Bot"
          git config user.email "bot@catflix.local"
          git add posters catalog.json
          git commit -m "tam_katalog_ve_canli_tv" || exit 0
          git push

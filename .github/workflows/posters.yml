name: CATFLIX Gercek Afisler
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  posters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p posters
          curl -s "https://tvmaze.com" -o shows.json
          curl -s "https://jikan.moe" -o anime.json
          cat << 'EOF' > parse.py
          import json, re, subprocess
          shows = json.load(open("shows.json"))[:30]
          animes = json.load(open("anime.json")).get("data", [])

          def grab(img_url, fn):
              if not img_url: return ""
              subprocess.run(["curl", "-sL", img_url, "-o", "posters/" + fn])
              return "/" + fn

          s_list = []
          for s in shows:
              img = (s.get("image") or {}).get("original") or (s.get("image") or {}).get("medium") or ""
              p = grab(img, f"s_{s['id']}.jpg")
              s_list.append({
                  "id": s["id"],
                  "title": s["name"],
                  "vote_average": (s.get("rating") or {}).get("average") or 8.4,
                  "overview": re.sub(r"<[^>]*>", "", s.get("summary") or "Popüler yapım."),
                  "poster_path": p,
                  "backdrop_path": p
              })

          a_list = []
          for a in animes:
              img = ((a.get("images") or {}).get("jpg") or {}).get("large_image_url") or ""
              p = grab(img, f"a_{a['mal_id']}.jpg")
              a_list.append({
                  "id": a["mal_id"],
                  "title": a.get("title_english") or a.get("title", ""),
                  "vote_average": a.get("score") or 8.6,
                  "overview": a.get("synopsis") or "Popüler anime yapımı.",
                  "poster_path": p,
                  "backdrop_path": p
              })

          data = {"trending": s_list[:10], "movies": s_list[10:20], "tv": s_list[20:30], "anime": a_list}
          open("catalog.json", "w", encoding="utf-8").write(json.dumps(data, ensure_ascii=False))
          EOF
          python3 parse.py
          git config user.name "Bot"
          git config user.email "bot@catflix.local"
          git add posters catalog.json
          git commit -m "afisler" || exit 0
          git push

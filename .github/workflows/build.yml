name: CATFLIX Android APK Olustur
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: CATFLIX APK Derle
        run: |
          pip install -q pillow
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          cp index.html www/index.html
          npx cap init "CATFLIX" "com.catflix.app" --web-dir www
          npx cap add android
          python3 -c '
          from PIL import Image, ImageDraw
          import glob
          for path in glob.glob("android/app/src/main/res/mipmap-*/ic_launcher*.png"):
              im = Image.open(path).convert("RGBA")
              w, h = im.size
              draw = ImageDraw.Draw(im)
              draw.rectangle([0, 0, w, h], fill=(8, 8, 8, 255))
              pad = int(w * 0.20)
              thick = max(4, int(w * 0.14))
              draw.arc([pad + 2, pad + 3, w - pad + 2, h - pad + 3], start=42, end=318, fill=(130, 0, 10, 255), width=thick)
              draw.arc([pad, pad, w - pad, h - pad], start=42, end=318, fill=(240, 0, 22, 255), width=thick)
              im.save(path)
          m = "android/app/src/main/AndroidManifest.xml"
          open(m, "w").write(open(m).read().replace("<application", "<application android:usesCleartextTraffic=\"true\""))
          '
          npx cap copy android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: CATFLIX APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: CATFLIX-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

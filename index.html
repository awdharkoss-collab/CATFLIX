<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATFLIX • Ücretsiz Sinema & Klasikler</title>
    <style>
        :root { --bg: #08080c; --panel: #12121a; --red: #e50914; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: #fff; padding-bottom: 40px; }
        nav { position: fixed; top: 0; left: 0; right: 0; z-index: 40; display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: rgba(8,8,12,0.95); border-bottom: 1px solid rgba(255,255,255,0.08); gap: 10px; }
        .nav-left { display: flex; align-items: center; gap: 16px; overflow-x: auto; }
        .logo { font-size: 24px; font-weight: 900; color: var(--red); cursor: pointer; letter-spacing: 1.5px; }
        .nav-link { color: #cbd5e1; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .nav-link.active { color: #fff; border-bottom: 2px solid var(--red); }
        input { background: #1c1c26; border: 1px solid #333; color: #fff; padding: 6px 12px; border-radius: 16px; width: 140px; outline: none; }
        .hero { position: relative; min-height: 380px; padding: 110px 24px 36px; background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: flex-end; }
        .hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, rgba(8,8,12,0.95) 28%, rgba(8,8,12,0.3) 85%), linear-gradient(to top, var(--bg) 8%, transparent 65%); }
        .hero-content { position: relative; z-index: 10; max-width: 560px; }
        .hero-title { font-size: 34px; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; }
        .hero-desc { font-size: 13px; color: #cbd5e1; margin-bottom: 16px; line-height: 1.5; }
        .btn-red { background: var(--red); color: #fff; border: none; padding: 11px 20px; border-radius: 8px; font-weight: 800; cursor: pointer; margin-right: 8px; }
        .btn-glass { background: rgba(255,255,255,0.18); color: #fff; border: none; padding: 11px 16px; border-radius: 8px; font-weight: 800; cursor: pointer; }
        .section { padding: 16px 20px 6px; }
        .sec-title { font-size: 16px; font-weight: 800; margin-bottom: 10px; }
        .row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; }
        .poster-card { position: relative; flex: 0 0 155px; border-radius: 10px; overflow: hidden; background: var(--panel); border: 1px solid rgba(255,255,255,0.14); cursor: pointer; transition: 0.2s; }
        .poster-card:hover { transform: scale(1.04); border-color: var(--red); }
        .poster-card img { width: 100%; height: 225px; object-fit: cover; display: block; background: #1e293b; }
        .rating-pill { position: absolute; top: 8px; left: 8px; z-index: 2; background: rgba(0,0,0,0.85); color: #4ade80; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px; }
        .poster-info { padding: 8px; }
        .poster-name { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 60; align-items: center; justify-content: center; padding: 16px; }
        .player-box { background: #000; border: 1px solid var(--red); border-radius: 14px; max-width: 820px; width: 100%; overflow: hidden; }
        video { width: 100%; max-height: 70vh; background: #000; display: block; }
    </style>
</head>
<body>
<nav>
    <div class="nav-left">
        <div class="logo" onclick="loadHome()">CATFLIX</div>
        <span class="nav-link active" onclick="switchCat(this, 'all')">Tüm Filmler</span>
        <span class="nav-link" onclick="switchCat(this, 'horror')">Korku & Gerilim</span>
        <span class="nav-link" onclick="switchCat(this, 'scifi')">Bilim Kurgu</span>
        <span class="nav-link" onclick="switchCat(this, 'comedy')">Komedi & Macera</span>
        <span class="nav-link" onclick="switchCat(this, 'watchlist')">Listem</span>
    </div>
    <input type="text" id="searchInput" placeholder="Film ara..." oninput="searchCatalog(this.value)">
</nav>

<div class="hero" id="heroBanner">
    <div class="hero-content">
        <h1 class="hero-title" id="heroTitle">CATFLIX</h1>
        <p class="hero-desc" id="heroDesc"></p>
        <button type="button" class="btn-red" onclick="playMovie(heroItem)">▶ Hemen İzle</button>
        <button type="button" class="btn-glass" onclick="toggleFav(heroItem)">+ Listeye Ekle</button>
    </div>
</div>

<div id="catalogContainer"></div>

<div class="modal" id="playerModal" onclick="if(event.target===this) closePlayer()">
    <div class="player-box">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#12121a;">
            <div>
                <h3 id="pTitle" style="font-size:16px;"></h3>
                <div id="pMeta" style="font-size:11px;color:#4ade80;"></div>
            </div>
            <button type="button" class="btn-red" style="padding:6px 14px;margin:0;" onclick="closePlayer()">✕ Kapat</button>
        </div>
        <video id="videoPlayer" controls playsinline></video>
        <div id="pDesc" style="padding:12px 16px;font-size:13px;color:#cbd5e1;background:#12121a;"></div>
    </div>
</div>
<script>
    const MOVIES = [
        {
            id: "night_of_the_living_dead",
            cat: "horror",
            title: "Yaşayan Ölülerin Gecesi (1968)",
            vote: "7.8",
            poster: "https://archive.org",
            video: "https://archive.org",
            desc: "George A. Romero'nun sinema tarihini değiştiren efsanevi korku klasiği. Pensilvanya kırsalında bir çiftlik evine sığınan yedi kişi gece boyunca hayatta kalmaya çalışır."
        },
        {
            id: "charade_1963",
            cat: "comedy",
            title: "Öldüren Şüphe / Charade (1963)",
            vote: "7.9",
            poster: "https://archive.org",
            video: "https://archive.org",
            desc: "Cary Grant ve Audrey Hepburn'ün başrollerini paylaştığı, Paris'te geçen gerilim ve romantizm dolu casusluk klasiği."
        },
        {
            id: "house_on_haunted_hill",
            cat: "horror",
            title: "Lanetli Tepe (1959)",
            vote: "6.9",
            poster: "https://archive.org",
            video: "https://archive.org",
            desc: "Eksantrik bir milyoner, beş yabancıya perili bir malikanede bir gece boyunca hayatta kalmaları karşılığında 10.000 dolar teklif eder."
        },
        {
            id: "plan_9_from_outer_space",
            cat: "scifi",
            title: "Uzaydan Gelen 9. Plan (1959)",
            vote: "6.5",
            poster: "https://archive.org",
            video: "https://archive.org",
            desc: "Uzaylılar, insanlığın dünyayı yok edecek kıyamet silahları geliştirmesini engellemek için mezarlıktaki ölüleri diriltir."
        },
        {
            id: "his_girl_friday",
            cat: "comedy",
            title: "Cuma Kızı / His Girl Friday (1940)",
            vote: "7.9",
            poster: "https://archive.org",
            video: "https://archive.org",
            desc: "Usta bir gazete editörü, eski eşi ve en iyi muhabiri olan Hildy'yi yeni nişanlısından ayırıp son bir büyük habere ikna etmeye çalışır."
        },
        {
            id: "nosferatu_1922",
            cat: "horror",
            title: "Nosferatu: Bir Dehşet Senfonisi (1922)",
            vote: "7.9",
            poster: "https://archive.org",
            video: "https://archive.org",
            desc: "Kont Orlok'un Transilvanya şatosundan Almanya'ya uzanan karanlık lanetini anlatan tüm zamanların en ikonik vampir filmi."
        },
        {
            id: "voyage_to_planet_of_prehistoric_women",
            cat: "scifi",
            title: "Tarih Öncesi Gezegene Yolculuk (1968)",
            vote: "6.4",
            poster: "https://archive.org",
            video: "https://archive.org",
            desc: "Venüs gezegenine iniş yapan astronot ekibi, dev yaratıklar ve gizemli telepatik güçlere sahip uygarlıkla karşılaşır."
        },
        {
            id: "the_general_1926",
            cat: "comedy",
            title: "General / The General (1926)",
            vote: "8.1",
            poster: "https://archive.org",
            video: "https://archive.org",
            desc: "Buster Keaton'ın kaçırılan lokomotifini ve sevdiği kadını kurtarmak için tek başına giriştiği nefes kesici tren macerası."
        }
    ];

    let heroItem = MOVIES[0];
    let watchlist = JSON.parse(localStorage.getItem("catflix_list") || "[]");

    function setHero(m) {
        if (!m) return;
        heroItem = m;
        document.getElementById("heroBanner").style.backgroundImage = "url('" + m.poster + "')";
        document.getElementById("heroTitle").innerText = m.title;
        document.getElementById("heroDesc").innerText = m.desc;
    }

    function buildRow(title, list) {
        if (!list || !list.length) return "";
        let html = "";
        for (let i = 0; i < list.length; i++) {
            const m = list[i];
            html += '<div class="poster-card" onclick="playById(\'' + m.id + '\')">' +
                '<span class="rating-pill">★ ' + m.vote + '</span>' +
                '<img src="' + m.poster + '" alt="' + m.title.replace(/"/g, "") + '">' +
                '<div class="poster-info"><div class="poster-name">' + m.title + '</div></div></div>';
        }
        return '<div class="section"><div class="sec-title">' + title + '</div><div class="row">' + html + '</div></div>';
    }

    function loadHome() {
        setHero(MOVIES[0]);
        document.getElementById("catalogContainer").innerHTML =
            buildRow("🔥 Öne Çıkan Tam Uzunluk Filmler", MOVIES) +
            buildRow("👻 Korku & Gerilim Klasikleri", MOVIES.filter(m => m.cat === "horror")) +
            buildRow("🚀 Bilim Kurgu Sineması", MOVIES.filter(m => m.cat === "scifi")) +
            buildRow("🎭 Komedi & Macera", MOVIES.filter(m => m.cat === "comedy"));
    }

    function switchCat(el, cat) {
        document.querySelectorAll(".nav-link").forEach(n => n.classList.remove("active"));
        el.classList.add("active");
        const c = document.getElementById("catalogContainer");
        if (cat === "all") { loadHome(); return; }
        if (cat === "watchlist") {
            c.innerHTML = watchlist.length ? buildRow("❤️ İzleme Listem", watchlist) : '<div class="section">Listeniz henüz boş.</div>';
            return;
        }
        const filtered = MOVIES.filter(m => m.cat === cat);
        setHero(filtered[0]);
        c.innerHTML = buildRow("🎬 Seçili Kategori", filtered);
    }

    function searchCatalog(q) {
        const t = q.trim().toLowerCase();
        if (!t) { loadHome(); return; }
        const found = MOVIES.filter(m => m.title.toLowerCase().indexOf(t) !== -1);
        document.getElementById("catalogContainer").innerHTML = buildRow('🔍 "' + q + '" Sonuçları', found);
    }

    function playById(id) {
        const m = MOVIES.find(x => x.id === id);
        if (m) playMovie(m);
    }

    function playMovie(m) {
        if (!m) return;
        document.getElementById("pTitle").innerText = m.title;
        document.getElementById("pMeta").innerText = "★ " + m.vote + "  •  Ücretsiz Tam Sürüm (Archive.org)";
        document.getElementById("pDesc").innerText = m.desc;
        const vid = document.getElementById("videoPlayer");
        vid.src = m.video;
        document.getElementById("playerModal").style.display = "flex";
        vid.play().catch(() => {});
    }

    function closePlayer() {
        const vid = document.getElementById("videoPlayer");
        vid.pause();
        vid.src = "";
        document.getElementById("playerModal").style.display = "none";
    }

    function toggleFav(m) {
        if (!m) return;
        const idx = watchlist.findIndex(w => w.id === m.id);
        if (idx >= 0) watchlist.splice(idx, 1);
        else watchlist.unshift(m);
        localStorage.setItem("catflix_list", JSON.stringify(watchlist));
        alert(idx >= 0 ? "Listeden çıkarıldı." : "✅ İzleme listene eklendi!");
    }

    loadHome();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATFLIX</title>
    <style>
        :root { --bg: #08080c; --panel: #12121a; --red: #e50914; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: #fff; padding-bottom: 40px; }
        nav { position: fixed; top: 0; left: 0; right: 0; z-index: 40; display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: rgba(8,8,12,0.95); border-bottom: 1px solid rgba(255,255,255,0.08); gap: 10px; }
        .nav-left { display: flex; align-items: center; gap: 16px; overflow-x: auto; }
        .logo { font-size: 24px; font-weight: 900; color: var(--red); cursor: pointer; letter-spacing: 1.5px; }
        .nav-link { color: #cbd5e1; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .nav-link.active { color: #fff; border-bottom: 2px solid var(--red); }
        input { background: #1c1c26; border: 1px solid #333; color: #fff; padding: 6px 12px; border-radius: 16px; width: 135px; outline: none; }
        .hero { position: relative; min-height: 360px; padding: 110px 24px 36px; background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: flex-end; }
        .hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, rgba(8,8,12,0.94) 28%, rgba(8,8,12,0.25) 85%), linear-gradient(to top, var(--bg) 8%, transparent 65%); }
        .hero-content { position: relative; z-index: 10; max-width: 560px; }
        .hero-title { font-size: 36px; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; }
        .hero-desc { font-size: 13px; color: #cbd5e1; margin-bottom: 16px; line-height: 1.5; }
        .btn-red { background: var(--red); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 800; cursor: pointer; margin-right: 8px; }
        .btn-glass { background: rgba(255,255,255,0.18); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 800; cursor: pointer; }
        .section { padding: 16px 20px 6px; }
        .sec-title { font-size: 16px; font-weight: 800; margin-bottom: 10px; }
        .row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; }
        .poster-card { position: relative; flex: 0 0 150px; border-radius: 10px; overflow: hidden; background: var(--panel); border: 1px solid rgba(255,255,255,0.14); cursor: pointer; transition: 0.2s; }
        .poster-card:hover { transform: scale(1.04); border-color: var(--red); }
        .poster-card img { width: 100%; height: 220px; object-fit: cover; display: block; background: #1e293b; }
        .rating-pill { position: absolute; top: 8px; left: 8px; z-index: 2; background: rgba(0,0,0,0.85); color: #4ade80; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px; }
        .poster-info { padding: 8px; }
        .poster-name { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 60; align-items: center; justify-content: center; padding: 16px; }
        .modal-box { background: var(--panel); border: 1px solid var(--red); border-radius: 14px; max-width: 460px; width: 100%; padding: 20px; }
    </style>
</head>
<body>
<nav>
    <div class="nav-left">
        <div class="logo" onclick="loadHome()">CATFLIX</div>
        <span class="nav-link active" onclick="switchCat(this, 'home')">Ana Sayfa</span>
        <span class="nav-link" onclick="switchCat(this, 'movie')">Filmler</span>
        <span class="nav-link" onclick="switchCat(this, 'tv')">Diziler</span>
        <span class="nav-link" onclick="switchCat(this, 'anime')">Anime</span>
        <span class="nav-link" onclick="switchCat(this, 'watchlist')">Listem</span>
    </div>
    <input type="text" id="searchInput" placeholder="Film, dizi ara..." oninput="searchCatalog(this.value)">
</nav>

<div class="hero" id="heroBanner">
    <div class="hero-content">
        <h1 class="hero-title" id="heroTitle">CATFLIX</h1>
        <p class="hero-desc" id="heroDesc"></p>
        <button type="button" class="btn-red" onclick="watchHeroTrailer()">▶ Fragman</button>
        <button type="button" class="btn-glass" onclick="openHeroDetails()">ⓘ Detay</button>
    </div>
</div>

<div id="catalogContainer"></div>

<div class="modal" id="detailModal" onclick="if(event.target===this) closeModal()">
    <div class="modal-box">
        <h2 id="mTitle" style="margin-bottom:6px;"></h2>
        <div id="mMeta" style="font-size:12px; color:#4ade80; margin-bottom:10px;"></div>
        <p id="mOverview" style="font-size:13px; color:#cbd5e1; line-height:1.5; max-height:180px; overflow-y:auto; margin-bottom:14px;"></p>
        <button type="button" class="btn-red" id="mTrailerBtn">▶ YouTube Fragman</button>
        <button type="button" class="btn-glass" id="mFavBtn">+ Listeye Ekle</button>
        <button type="button" class="btn-glass" onclick="closeModal()">Kapat</button>
    </div>
</div>

<script>
    const FALLBACK = {
        trending: [
            { id: 1, title: "Yıldızlararası", vote_average: 8.7, overview: "İnsanlığın geleceğini kurtarmak için solucan deliğinden geçerek yeni yaşanabilir gezegenler arayan astronotların destansı yolculuğu.", poster_path: "https://unsplash.com", backdrop_path: "https://unsplash.com" },
            { id: 2, title: "Dune: Çöl Gezegeni 2", vote_average: 8.5, overview: "Paul Atreides, ailesini yok eden komploculardan intikam almak için Chani ve Fremenlerle güçlerini birleştirir.", poster_path: "https://unsplash.com", backdrop_path: "https://unsplash.com" },
            { id: 3, title: "Başlangıç (Inception)", vote_average: 8.8, overview: "Rüyalara girerek bilinçaltındaki sırları çalan usta bir hırsıza bu kez bir fikri zihne yerleştirme görevi verilir.", poster_path: "https://unsplash.com", backdrop_path: "https://unsplash.com" },
            { id: 4, title: "Kara Şövalye", vote_average: 9.0, overview: "Batman, Gotham şehrini kaosa sürükleyen Joker'in acımasız oyunlarıyla yüzleşmek zorundadır.", poster_path: "https://unsplash.com", backdrop_path: "https://unsplash.com" }
        ],
        tv: [
            { id: 5, title: "Breaking Bad", vote_average: 9.5, overview: "Kimya öğretmeni Walter White, ailesinin geleceğini güvence altına almak için eski öğrencisiyle tehlikeli bir ortaklığa girer.", poster_path: "https://unsplash.com", backdrop_path: "https://unsplash.com" },
            { id: 6, title: "Game of Thrones", vote_average: 9.2, overview: "Yedi Krallık'ın Demir Tahtı için soylu hanedanlar arasında yaşanan kanlı iktidar ve ihanet mücadelesi.", poster_path: "https://unsplash.com", backdrop_path: "https://unsplash.com" },
            { id: 7, title: "Stranger Things", vote_average: 8.7, overview: "Küçük bir kasabada bir çocuğun gizemli şekilde kaybolmasıyla doğaüstü güçler ve gizli deneyler gün yüzüne çıkar.", poster_path: "https://unsplash.com", backdrop_path: "https://unsplash.com" }
        ],
        anime: [
            { id: 8, title: "Attack on Titan", vote_average: 9.1, overview: "İnsanlık, dev Titanlardan korunmak için inşa ettiği devasa surların ardında hayatta kalma savaşı verir.", poster_path: "https://unsplash.com", backdrop_path: "https://unsplash.com" },
            { id: 9, title: "Demon Slayer", vote_average: 8.6, overview: "Ailesi iblisler tarafından katledilen Tanjiro, iblise dönüşen kız kardeşi Nezuko'yu kurtarmak için iblis avcısı olur.", poster_path: "https://unsplash.com", backdrop_path: "https://unsplash.com" },
            { id: 10, title: "Jujutsu Kaisen", vote_average: 8.6, overview: "Lise öğrencisi Yuji Itadori, arkadaşlarını kurtarmak için lanetli bir tılsımı yutarak büyücülük dünyasına adım atar.", poster_path: "https://unsplash.com", backdrop_path: "https://unsplash.com" }
        ]
    };
    DATA = FALLBACK;
    let heroItem = null, itemsMap = {}, watchlist = JSON.parse(localStorage.getItem("catflix_list") || "[]");

       function resolveImg(path, id) {
        if (id) return "./posters/" + id + ".jpg";
        if (!path) return "";
        if (path.indexOf("http") === 0) return path;
        return "./posters/" + path.replace(/^\//, "");
    }


    function setHero(item) {
        if (!item) return;
        heroItem = item;
        const imgUrl = resolveImg(item.backdrop_path || item.poster_path);
        if (imgUrl) document.getElementById("heroBanner").style.backgroundImage = "url('" + imgUrl + "')";
        document.getElementById("heroTitle").innerText = item.title || item.name || "CATFLIX";
        document.getElementById("heroDesc").innerText = item.overview || "";
    }

    function buildRow(title, items) {
        if (!items || !items.length) return "";
        let html = "";
        for (let i = 0; i < items.length; i++) {
            const it = items.at(i);
            const key = (it.title ? "m_" : "t_") + it.id;
            itemsMap[key] = it;
            const name = it.title || it.name || "";
            const score = it.vote_average ? Number(it.vote_average).toFixed(1) : "8.5";
            const imgUrl = resolveImg(it.poster_path);
            html += '<div class="poster-card" onclick="openDetail(\'' + key + '\')">' +
                '<span class="rating-pill">★ ' + score + '</span>' +
                '<img src="' + imgUrl + '" alt="' + name.replace(/"/g, "") + '">' +
                '<div class="poster-info"><div class="poster-name">' + name + '</div></div></div>';
        }
        return '<div class="section"><div class="sec-title">' + title + '</div><div class="row">' + html + '</div></div>';
    }

    async function loadHome() {
        try {
            const res = await fetch("./catalog.json?v=" + Date.now());
            if (res.ok) {
                const remote = await res.json();
                if (remote && remote.trending && remote.trending.length > 0) DATA = remote;
            }
        } catch (e) {}
        setHero((DATA.trending || []).at(0));
        document.getElementById("catalogContainer").innerHTML =
            buildRow("🔥 Haftanın Trendleri", DATA.trending) +
            buildRow("🎬 Popüler Filmler", DATA.movies || DATA.trending) +
            buildRow("📺 Popüler Diziler", DATA.tv) +
            buildRow("⛩️ Popüler Animeler", DATA.anime);
    }

    function switchCat(el, cat) {
        document.querySelectorAll(".nav-link").forEach(function(n) { n.classList.remove("active"); });
        el.classList.add("active");
        const c = document.getElementById("catalogContainer");
        if (cat === "home") { loadHome(); return; }
        if (cat === "watchlist") { c.innerHTML = watchlist.length ? buildRow("❤️ İzleme Listem", watchlist) : '<div class="section">Listeniz henüz boş.</div>'; return; }
        if (cat === "movie") { const list = DATA.movies || DATA.trending; setHero(list.at(0)); c.innerHTML = buildRow("🎬 Popüler Filmler", list); }
        if (cat === "tv") { setHero((DATA.tv || []).at(0)); c.innerHTML = buildRow("📺 Popüler Diziler", DATA.tv); }
        if (cat === "anime") { setHero((DATA.anime || []).at(0)); c.innerHTML = buildRow("⛩️ Trend Animeler", DATA.anime); }
    }

    function searchCatalog(q) {
        const t = q.trim().toLowerCase();
        if (!t) { loadHome(); return; }
        const found = Object.values(itemsMap).filter(function(i) { return (i.title || i.name || "").toLowerCase().indexOf(t) !== -1; });
        document.getElementById("catalogContainer").innerHTML = buildRow('🔍 "' + q + '" Sonuçları', found);
    }

    function openDetail(key) {
        const it = itemsMap[key];
        if (!it) return;
        const name = it.title || it.name || "";
        document.getElementById("mTitle").innerText = name;
        document.getElementById("mMeta").innerText = "★ " + (it.vote_average ? Number(it.vote_average).toFixed(1) : "8.5");
        document.getElementById("mOverview").innerText = it.overview || "Türkçe açıklama.";
        document.getElementById("mTrailerBtn").onclick = function() { window.open("https://youtube.com" + encodeURIComponent(name + " Türkçe fragman"), "_blank"); };
        document.getElementById("mFavBtn").onclick = function() {
            const idx = watchlist.findIndex(function(w) { return w.id === it.id; });
            if (idx >= 0) watchlist.splice(idx, 1); else watchlist.unshift(it);
            localStorage.setItem("catflix_list", JSON.stringify(watchlist));
            alert(idx >= 0 ? "Listeden çıkarıldı." : "✅ Listeye eklendi!");
        };
        document.getElementById("detailModal").style.display = "flex";
    }

    function closeModal() { document.getElementById("detailModal").style.display = "none"; }
    function watchHeroTrailer() { if (heroItem) window.open("https://youtube.com" + encodeURIComponent((heroItem.title || heroItem.name) + " Türkçe fragman"), "_blank"); }
    function openHeroDetails() { if (heroItem) { const k = (heroItem.title ? "m_" : "t_") + heroItem.id; itemsMap[k] = heroItem; openDetail(k); } }

    loadHome();
</script>
</body>
</html>

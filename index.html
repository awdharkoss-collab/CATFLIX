<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATFLIX • Sinema, Dizi, Anime & Canlı TV</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --bg: #08080c; --panel: #12121a; --red: #e50914; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: #fff; padding-bottom: 50px; }
        nav { position: fixed; top: 0; left: 0; right: 0; z-index: 40; display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: rgba(8,8,12,0.96); border-bottom: 1px solid rgba(255,255,255,0.08); gap: 10px; }
        .nav-left { display: flex; align-items: center; gap: 15px; overflow-x: auto; scrollbar-width: none; }
        .nav-left::-webkit-scrollbar { display: none; }
        .logo { font-size: 24px; font-weight: 900; color: var(--red); cursor: pointer; letter-spacing: 1.5px; }
        .nav-link { color: #cbd5e1; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; padding-bottom: 3px; }
        .nav-link.active { color: #fff; border-bottom: 2px solid var(--red); }
        .live-badge { background: var(--red); color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: 800; }
        input { background: #1c1c26; border: 1px solid #333; color: #fff; padding: 7px 13px; border-radius: 18px; width: 145px; outline: none; font-size: 13px; }
        .hero { position: relative; min-height: 390px; padding: 110px 24px 36px; background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: flex-end; }
        .hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, rgba(8,8,12,0.95) 28%, rgba(8,8,12,0.25) 85%), linear-gradient(to top, var(--bg) 8%, transparent 65%); }
        .hero-content { position: relative; z-index: 10; max-width: 580px; }
        .hero-meta { color: #4ade80; font-size: 12px; font-weight: 800; margin-bottom: 6px; }
        .hero-title { font-size: 34px; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; }
        .hero-desc { font-size: 13px; color: #cbd5e1; margin-bottom: 16px; line-height: 1.5; }
        .btn-red { background: var(--red); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 800; cursor: pointer; margin-right: 8px; }
        .btn-glass { background: rgba(255,255,255,0.18); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 800; cursor: pointer; }
        .section { padding: 18px 20px 6px; }
        .sec-title { font-size: 16px; font-weight: 800; margin-bottom: 10px; }
        .row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; }
        .poster-card { position: relative; flex: 0 0 152px; border-radius: 10px; overflow: hidden; background: var(--panel); border: 1px solid rgba(255,255,255,0.14); cursor: pointer; transition: 0.2s; }
        .poster-card:hover { transform: scale(1.04); border-color: var(--red); }
        .poster-card img { width: 100%; height: 220px; object-fit: cover; display: block; background: #1e293b; }
        .rating-pill { position: absolute; top: 8px; left: 8px; z-index: 2; background: rgba(0,0,0,0.85); color: #4ade80; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px; }
        .year-pill { position: absolute; top: 8px; right: 8px; z-index: 2; background: rgba(229,9,20,0.9); color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 5px; }
        .poster-info { padding: 8px; }
        .poster-name { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 12px; }
        .tv-card { background: var(--panel); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 14px 10px; text-align: center; cursor: pointer; transition: 0.2s; }
        .tv-card:hover { border-color: var(--red); transform: translateY(-2px); }
        .tv-card img { width: 54px; height: 54px; object-fit: contain; margin-bottom: 8px; border-radius: 8px; background: #1e293b; padding: 4px; }
        .tv-name { font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 60; align-items: center; justify-content: center; padding: 16px; }
        .modal-box { background: var(--panel); border: 1px solid var(--red); border-radius: 14px; max-width: 720px; width: 100%; overflow: hidden; }
        video { width: 100%; max-height: 65vh; background: #000; display: block; }
    </style>
</head>
<body>
<nav>
    <div class="nav-left">
        <div class="logo" onclick="loadHome()">CATFLIX</div>
        <span class="nav-link active" onclick="switchCat(this, 'home')">Ana Sayfa</span>
        <span class="nav-link" onclick="switchCat(this, 'movie')">Filmler</span>
        <span class="nav-link" onclick="switchCat(this, 'tv')">Diziler</span>
        <span class="nav-link" onclick="switchCat(this, 'anime')">Anime</span>
        <span class="nav-link" onclick="switchCat(this, 'livetv')"><span class="live-badge">● CANLI TV</span></span>
        <span class="nav-link" onclick="switchCat(this, 'watchlist')">Listem</span>
    </div>
    <input type="text" id="searchInput" placeholder="Film, dizi, kanal ara..." oninput="searchCatalog(this.value)">
</nav>

<div class="hero" id="heroBanner">
    <div class="hero-content">
        <div class="hero-meta" id="heroMeta"></div>
        <h1 class="hero-title" id="heroTitle">CATFLIX</h1>
        <p class="hero-desc" id="heroDesc"></p>
        <button type="button" class="btn-red" onclick="watchHeroTrailer()">▶ Fragman / İzle</button>
        <button type="button" class="btn-glass" onclick="openHeroDetails()">ⓘ Detay & Liste</button>
    </div>
</div>

<div id="catalogContainer"></div>

<div class="modal" id="detailModal" onclick="if(event.target===this) closeModal()">
    <div class="modal-box">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.1);">
            <div>
                <h2 id="mTitle" style="font-size:18px;"></h2>
                <div id="mMeta" style="font-size:12px;color:#4ade80;"></div>
            </div>
            <button type="button" class="btn-red" style="padding:6px 14px;margin:0;" onclick="closeModal()">✕ Kapat</button>
        </div>
        <div id="tvPlayerWrap" style="display:none;"><video id="tvVideo" controls playsinline></video></div>
        <div style="padding:18px;">
            <p id="mOverview" style="font-size:13px;color:#cbd5e1;line-height:1.6;max-height:160px;overflow-y:auto;margin-bottom:14px;"></p>
            <div id="mActions">
                <button type="button" class="btn-red" id="mTrailerBtn">▶ YouTube Resmi Fragman</button>
                <button type="button" class="btn-glass" id="mFavBtn">+ İzleme Listeme Ekle</button>
            </div>
        </div>
    </div>
</div>
<script>
    let DATA = { trending: [], movies: [], top_movies: [], tv: [], top_tv: [], anime: [], action: [], scifi: [], channels: [] };
    let heroItem = null, itemsMap = {}, hlsInstance = null;
    let watchlist = JSON.parse(localStorage.getItem("catflix_list") || "[]");

    function setHero(item) {
        if (!item) return;
        heroItem = item;
        document.getElementById("heroBanner").style.backgroundImage = "url('" + (item.backdrop || item.poster) + "')";
        document.getElementById("heroMeta").innerText = "★ " + item.vote + (item.year ? "  •  " + item.year : "") + "  •  ÖNE ÇIKAN YAPIM";
        document.getElementById("heroTitle").innerText = item.title;
        document.getElementById("heroDesc").innerText = item.overview;
    }

    function buildRow(title, items) {
        if (!items || !items.length) return "";
        let html = "";
        for (let i = 0; i < items.length; i++) {
            const it = items[i];
            itemsMap[it.id] = it;
            html += '<div class="poster-card" onclick="openDetail(' + it.id + ')">' +
                '<span class="rating-pill">★ ' + it.vote + '</span>' +
                (it.year ? '<span class="year-pill">' + it.year + '</span>' : '') +
                '<img src="' + it.poster + '" alt="' + it.title.replace(/"/g, "") + '" loading="lazy">' +
                '<div class="poster-info"><div class="poster-name">' + it.title + '</div></div></div>';
        }
        return '<div class="section"><div class="sec-title">' + title + '</div><div class="row">' + html + '</div></div>';
    }

    function buildTvGrid(channels) {
        if (!channels || !channels.length) return '<div class="section">Canlı TV kanalları yükleniyor...</div>';
        let html = '<div class="section"><div class="sec-title">📡 Canlı Türk TV Kanalları (' + channels.length + ' Kanal)</div><div class="tv-grid">';
        for (let i = 0; i < channels.length; i++) {
            const ch = channels[i];
            const logo = ch.logo || "data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='60' height='60'><rect width='60' height='60' fill='%231e293b'/><text x='30' y='36' fill='%23e50914' font-size='18' font-weight='bold' text-anchor='middle'>TV</text></svg>";
            html += '<div class="tv-card" onclick="playLiveTv(' + i + ')">' +
                '<img src="' + logo + '" onerror="this.style.opacity=0.3">' +
                '<div class="tv-name">' + ch.name + '</div></div>';
        }
        return html + '</div></div>';
    }

    async function loadHome() {
        try {
            const res = await fetch("./catalog.json?v=" + Date.now());
            if (res.ok) DATA = await res.json();
        } catch (e) {}
        setHero((DATA.trending || []).at(0));
        document.getElementById("catalogContainer").innerHTML =
            buildRow("🔥 Haftanın Trendleri", DATA.trending) +
            buildRow("🎬 Popüler Yeni Filmler", DATA.movies) +
            buildRow("📺 Popüler Yeni Diziler", DATA.tv) +
            buildRow("⛩️ Popüler Animeler", DATA.anime) +
            buildRow("💥 Aksiyon & Macera", DATA.action) +
            buildRow("🚀 Bilim Kurgu", DATA.scifi) +
            buildRow("🏆 Tüm Zamanların En İyi Filmleri", DATA.top_movies) +
            buildRow("⭐ En Yüksek Puanlı Diziler", DATA.top_tv);
    }

    function switchCat(el, cat) {
        document.querySelectorAll(".nav-link").forEach(n => n.classList.remove("active"));
        el.classList.add("active");
        const c = document.getElementById("catalogContainer");
        if (cat === "home") { loadHome(); return; }
        if (cat === "livetv") { c.innerHTML = buildTvGrid(DATA.channels); return; }
        if (cat === "watchlist") {
            c.innerHTML = watchlist.length ? buildRow("❤️ İzleme Listem", watchlist) : '<div class="section">İzleme listeniz henüz boş.</div>';
            return;
        }
        if (cat === "movie") { setHero((DATA.movies || []).at(0)); c.innerHTML = buildRow("🎬 Popüler Filmler", DATA.movies) + buildRow("💥 Aksiyon", DATA.action) + buildRow("🚀 Bilim Kurgu", DATA.scifi) + buildRow("🏆 En İyi Filmler", DATA.top_movies); }
        if (cat === "tv") { setHero((DATA.tv || []).at(0)); c.innerHTML = buildRow("📺 Popüler Diziler", DATA.tv) + buildRow("⭐ En Yüksek Puanlı Diziler", DATA.top_tv); }
        if (cat === "anime") { setHero((DATA.anime || []).at(0)); c.innerHTML = buildRow("⛩️ Trend Animeler", DATA.anime); }
    }

    function searchCatalog(q) {
        const t = q.trim().toLowerCase();
        if (!t) { loadHome(); return; }
        const foundItems = Object.values(itemsMap).filter(i => i.title.toLowerCase().indexOf(t) !== -1);
        const foundCh = (DATA.channels || []).filter(ch => ch.name.toLowerCase().indexOf(t) !== -1);
        let out = buildRow('🔍 "' + q + '" Film & Dizi Sonuçları', foundItems);
        if (foundCh.length) out += buildTvGrid(foundCh);
        document.getElementById("catalogContainer").innerHTML = out || '<div class="section">Sonuç bulunamadı.</div>';
    }

    function openDetail(id) {
        const it = itemsMap[id];
        if (!it) return;
        stopTv();
        document.getElementById("tvPlayerWrap").style.display = "none";
        document.getElementById("mActions").style.display = "block";
        document.getElementById("mTitle").innerText = it.title;
        document.getElementById("mMeta").innerText = "★ " + it.vote + (it.year ? "  •  " + it.year : "");
        document.getElementById("mOverview").innerText = it.overview;
        document.getElementById("mTrailerBtn").onclick = () => window.open("https://youtube.com" + encodeURIComponent(it.title + " Türkçe fragman"), "_blank");
        document.getElementById("mFavBtn").onclick = () => {
            const idx = watchlist.findIndex(w => w.id === it.id);
            if (idx >= 0) watchlist.splice(idx, 1); else watchlist.unshift(it);
            localStorage.setItem("catflix_list", JSON.stringify(watchlist));
            alert(idx >= 0 ? "Listeden çıkarıldı." : "✅ İzleme listene eklendi!");
        };
        document.getElementById("detailModal").style.display = "flex";
    }

    function playLiveTv(idx) {
        const ch = (DATA.channels || [])[idx];
        if (!ch) return;
        stopTv();
        document.getElementById("mTitle").innerText = ch.name;
        document.getElementById("mMeta").innerText = "● CANLI YAYIN";
        document.getElementById("mOverview").innerText = "Açık kaynaklı canlı TV yayını oynatılıyor.";
        document.getElementById("mActions").style.display = "none";
        document.getElementById("tvPlayerWrap").style.display = "block";
        const video = document.getElementById("tvVideo");
        if (Hls.isSupported()) {
            hlsInstance = new Hls();
            hlsInstance.loadSource(ch.url);
            hlsInstance.attachMedia(video);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
        } else {
            video.src = ch.url;
            video.play().catch(() => {});
        }
        document.getElementById("detailModal").style.display = "flex";
    }

    function stopTv() {
        const video = document.getElementById("tvVideo");
        video.pause();
        video.src = "";
        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    }

    function closeModal() { stopTv(); document.getElementById("detailModal").style.display = "none"; }
    function watchHeroTrailer() { if (heroItem) window.open("https://youtube.com" + encodeURIComponent(heroItem.title + " Türkçe fragman"), "_blank"); }
    function openHeroDetails() { if (heroItem) openDetail(heroItem.id); }

    loadHome();
</script>
</body>
</html>

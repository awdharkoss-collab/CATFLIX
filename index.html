<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CATFLIX • Türkçe Film, Dizi & Anime</title>
    <style>
        :root { --bg: #08080c; --panel: #12121a; --red: #e50914; --text: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; padding-bottom: 40px; }
        nav { position: fixed; top: 0; left: 0; right: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.92), transparent); gap: 12px; }
        .nav-left { display: flex; align-items: center; gap: 18px; overflow-x: auto; scrollbar-width: none; }
        .nav-left::-webkit-scrollbar { display: none; }
        .logo { font-size: 24px; font-weight: 900; color: var(--red); letter-spacing: 2px; cursor: pointer; text-shadow: 0 2px 12px rgba(229,9,20,0.5); white-space: nowrap; }
        .nav-links { display: flex; gap: 14px; }
        .nav-link { color: #cbd5e1; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: 0.2s; padding-bottom: 4px; border-bottom: 2px solid transparent; }
        .nav-link:hover, .nav-link.active { color: #fff; border-bottom-color: var(--red); }
        .search-wrap { display: flex; align-items: center; background: rgba(20,20,28,0.85); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 6px 12px; }
        .search-wrap input { background: transparent; border: none; color: #fff; font-size: 13px; outline: none; width: 135px; }
        .hero { position: relative; width: 100%; height: 70vh; min-height: 430px; background-size: cover; background-position: center top; display: flex; align-items: flex-end; padding: 0 24px 44px; transition: background-image 0.6s ease; }
        .hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, rgba(8,8,12,0.95) 20%, rgba(8,8,12,0.3) 65%, rgba(8,8,12,0.7) 100%), linear-gradient(to top, var(--bg) 5%, transparent 55%); }
        .hero-content { position: relative; z-index: 10; max-width: 560px; }
        .badge { display: inline-block; background: var(--red); color: #fff; font-size: 10px; font-weight: 900; padding: 4px 10px; border-radius: 4px; letter-spacing: 1.5px; margin-bottom: 10px; }
        .hero-title { font-size: clamp(24px, 5vw, 46px); font-weight: 900; line-height: 1.1; margin-bottom: 12px; text-transform: uppercase; }
        .hero-desc { font-size: 13px; color: #cbd5e1; line-height: 1.55; margin-bottom: 18px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .hero-btns { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-red { background: var(--red); color: #fff; border: none; padding: 11px 20px; border-radius: 8px; font-size: 13px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .btn-glass { background: rgba(255,255,255,0.14); backdrop-filter: blur(8px); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 11px 16px; border-radius: 8px; font-size: 13px; font-weight: 800; cursor: pointer; }
        .section { padding: 16px 20px 8px; }
        .sec-title { font-size: 17px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
        .row::-webkit-scrollbar { display: none; }
        .poster-card { position: relative; flex: 0 0 150px; border-radius: 10px; overflow: hidden; background: var(--panel); border: 1px solid rgba(255,255,255,0.08); cursor: pointer; transition: transform 0.25s, border-color 0.25s; }
        .poster-card:hover { transform: scale(1.05); border-color: var(--red); }
        .poster-card img { width: 100%; height: 225px; object-fit: cover; display: block; }
        .rating-pill { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.78); backdrop-filter: blur(4px); color: #4ade80; font-size: 11px; font-weight: 800; padding: 3px 7px; border-radius: 6px; }
        .fav-pill { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.78); color: #fff; border: none; width: 28px; height: 28px; border-radius: 6px; font-size: 13px; cursor: pointer; }
        .poster-info { padding: 8px; }
        .poster-name { font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 60; align-items: center; justify-content: center; padding: 16px; }
        .modal-box { background: var(--panel); border: 1px solid var(--red); border-radius: 16px; max-width: 500px; width: 100%; overflow: hidden; }
    </style>
</head>
<body>
<nav>
    <div class="nav-left">
        <div class="logo" onclick="loadHome()">CATFLIX</div>
        <div class="nav-links">
            <span class="nav-link active" onclick="switchCat(this, 'home')">Ana Sayfa</span>
            <span class="nav-link" onclick="switchCat(this, 'movie')">Filmler</span>
            <span class="nav-link" onclick="switchCat(this, 'tv')">Diziler</span>
            <span class="nav-link" onclick="switchCat(this, 'anime')">Anime</span>
            <span class="nav-link" onclick="switchCat(this, 'watchlist')">İzleme Listem</span>
        </div>
    </div>
    <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Film, dizi ara..." oninput="searchCatalog(this.value)">
        <span>🔍</span>
    </div>
</nav>

<div class="hero" id="heroBanner">
    <div class="hero-content">
        <div class="badge" id="heroBadge">BU HAFTA TREND</div>
        <h1 class="hero-title" id="heroTitle">CATFLIX YÜKLENİYOR...</h1>
        <p class="hero-desc" id="heroDesc">Haftanın trend filmleri, dizileri ve animeleri Türkçe açıklamalarıyla hazırlanıyor...</p>
        <div class="hero-btns">
            <button type="button" class="btn-red" onclick="watchHeroTrailer()">▶ Fragmanı İzle</button>
            <button type="button" class="btn-glass" onclick="addHeroToList()">+ Listeme Ekle</button>
            <button type="button" class="btn-glass" onclick="openHeroDetails()">ⓘ Detaylar</button>
        </div>
    </div>
</div>

<div id="catalogContainer"></div>

<div class="modal" id="detailModal" onclick="if(event.target===this) closeModal()">
    <div class="modal-box">
        <div style="padding:20px;">
            <h2 id="mTitle" style="margin-bottom:6px;"></h2>
            <div id="mMeta" style="font-size:12px; color:#4ade80; margin-bottom:12px;"></div>
            <p id="mOverview" style="font-size:13px; color:#cbd5e1; line-height:1.6; max-height:200px; overflow-y:auto; margin-bottom:16px;"></p>
            <div style="display:flex; gap:10px;">
                <button type="button" class="btn-red" style="flex:1; justify-content:center;" id="mTrailerBtn">▶ YouTube Fragman</button>
                <button type="button" class="btn-glass" onclick="closeModal()">Kapat</button>
            </div>
        </div>
    </div>
</div>
<script>
    const API_KEY = "4ef0be86342c15f9d510aef2774dfe78";
    const BASE_URL = "https://themoviedb.org";
    const IMG_BACKDROP = "https://tmdb.org";
    const IMG_POSTER = "https://tmdb.org";

    let heroItems = [];
    let heroIndex = 0;
    let heroTimer = null;
    let itemsMap = {};
    let watchlist = JSON.parse(localStorage.getItem("catflix_list") || "[]");

    async function fetchTmdb(endpoint) {
        const sep = endpoint.includes("?") ? "&" : "?";
        const target = `${BASE_URL}${endpoint}${sep}api_key=${API_KEY}&language=tr-TR`;
        const gateways = new Array(
            target,
            `https://corsproxy.io{encodeURIComponent(target)}`,
            `https://allorigins.win{encodeURIComponent(target)}`
        );
        for (const url of gateways) {
            try {
                const res = await fetch(url, { signal: AbortSignal.timeout(5000) });
                if (res.ok) return await res.json();
            } catch (e) {}
        }
        return { results: [] };
    }

    function setHero(item) {
        if (!item) return;
        const banner = document.getElementById("heroBanner");
        const bg = item.backdrop_path ? `${IMG_BACKDROP}${item.backdrop_path}` : `${IMG_POSTER}${item.poster_path}`;
        banner.style.backgroundImage = `url('${bg}')`;
        document.getElementById("heroBadge").innerText = item.media_type === "tv" ? "BU HAFTA TREND DİZİ" : "BU HAFTA TREND FİLM";
        document.getElementById("heroTitle").innerText = item.title || item.name || "CATFLIX";
        document.getElementById("heroDesc").innerText = item.overview || "Bu yapım için Türkçe özet bilgisi yakında eklenecektir.";
    }

    function startHeroSlider(items) {
        heroItems = items.filter(i => i.backdrop_path);
        if (!heroItems.length) return;
        heroIndex = 0;
        setHero(heroItems.at(0));
        clearInterval(heroTimer);
        heroTimer = setInterval(() => {
            heroIndex = (heroIndex + 1) % heroItems.length;
            setHero(heroItems.at(heroIndex));
        }, 7000);
    }

    function buildRow(title, items) {
        if (!items || !items.length) return "";
        const cards = items.filter(i => i.poster_path).map(item => {
            const key = `${item.media_type || (item.title ? "movie" : "tv")}_${item.id}`;
            itemsMap[key] = item;
            const name = item.title || item.name || "";
            const score = item.vote_average ? item.vote_average.toFixed(1) : "Yeni";
            const isSaved = watchlist.some(w => w.id === item.id);

            return `
                <div class="poster-card" onclick="openDetailByKey('${key}')">
                    <span class="rating-pill">★ ${score}</span>
                    <button type="button" class="fav-pill" onclick="event.stopPropagation(); toggleWatchlistByKey('${key}')">${isSaved ? "❤️" : "🔖"}</button>
                    <img src="${IMG_POSTER}${item.poster_path}" alt="${name}" loading="lazy">
                    <div class="poster-info">
                        <div class="poster-name">${name}</div>
                    </div>
                </div>
            `;
        }).join("");

        return `<div class="section"><div class="sec-title">${title}</div><div class="row">${cards}</div></div>`;
    }

    async function loadHome() {
        const container = document.getElementById("catalogContainer");
        container.innerHTML = `<div class="section" style="color:#94a3b8;">Katalog yükleniyor...</div>`;
        const [trending, popMovies, popTv, animeTv, topRated] = await Promise.all([
            fetchTmdb("/trending/all/week"),
            fetchTmdb("/movie/popular"),
            fetchTmdb("/tv/popular"),
            fetchTmdb("/discover/tv?with_genres=16&with_original_language=ja&sort_by=popularity.desc"),
            fetchTmdb("/movie/top_rated")
        ]);
        startHeroSlider(trending.results || []);
        container.innerHTML =
            buildRow("🔥 Haftanın Trendleri", trending.results) +
            buildRow("🎬 Popüler Filmler", popMovies.results) +
            buildRow("📺 Popüler Diziler", popTv.results) +
            buildRow("⛩️ Popüler Animeler", animeTv.results) +
            buildRow("🏆 Tüm Zamanların En İyileri", topRated.results);
    }

    async function switchCat(el, cat) {
        document.querySelectorAll(".nav-link").forEach(n => n.classList.remove("active"));
        el.classList.add("active");
        const container = document.getElementById("catalogContainer");
        if (cat === "home") { loadHome(); return; }
        if (cat === "watchlist") {
            container.innerHTML = watchlist.length
                ? buildRow("❤️ İzleme Listem", watchlist)
                : `<div class="section" style="color:#94a3b8;">İzleme listen henüz boş. Afişlerin sağ üstündeki 🔖 simgesine dokunarak ekleyebilirsin.</div>`;
            return;
        }
        if (cat === "movie") {
            const [p, u] = await Promise.all([fetchTmdb("/movie/popular"), fetchTmdb("/movie/upcoming")]);
            startHeroSlider(p.results || []);
            container.innerHTML = buildRow("🎬 Popüler Filmler", p.results) + buildRow("🗓️ Yakında Vizyonda", u.results);
        } else if (cat === "tv") {
            const [p, t] = await Promise.all([fetchTmdb("/tv/popular"), fetchTmdb("/tv/top_rated")]);
            startHeroSlider(p.results || []);
            container.innerHTML = buildRow("📺 Popüler Diziler", p.results) + buildRow("⭐ En Yüksek Puanlı Diziler", t.results);
        } else if (cat === "anime") {
            const a = await fetchTmdb("/discover/tv?with_genres=16&with_original_language=ja&sort_by=popularity.desc");
            startHeroSlider(a.results || []);
            container.innerHTML = buildRow("⛩️ Trend Animeler", a.results);
        }
    }

    let searchTimer = null;
    function searchCatalog(q) {
        clearTimeout(searchTimer);
        if (!q.trim()) { loadHome(); return; }
        searchTimer = setTimeout(async () => {
            const data = await fetchTmdb(`/search/multi?query=${encodeURIComponent(q.trim())}`);
            document.getElementById("catalogContainer").innerHTML = buildRow(`🔍 "${q}" Arama Sonuçları`, data.results);
        }, 350);
    }

    function openDetailByKey(key) {
        const item = itemsMap[key];
        if (!item) return;
        const name = item.title || item.name || "";
        const score = item.vote_average ? Number(item.vote_average).toFixed(1) : "Yeni";
        const year = (item.release_date || item.first_air_date || "").slice(0, 4);
        const typeLabel = (item.media_type === "tv" || !item.title) ? "Dizi" : "Film";
        document.getElementById("mTitle").innerText = name;
        document.getElementById("mMeta").innerText = `★ ${score}  •  ${year}  •  ${typeLabel}`;
        document.getElementById("mOverview").innerText = item.overview || "Bu yapım için Türkçe açıklama bulunmuyor.";
        document.getElementById("mTrailerBtn").onclick = () => {
            window.open(`https://youtube.com{encodeURIComponent(name + " Türkçe fragman")}`, "_blank");
        };
        document.getElementById("detailModal").style.display = "flex";
    }

    function closeModal() { document.getElementById("detailModal").style.display = "none"; }

    function toggleWatchlistByKey(key) {
        const item = itemsMap[key];
        if (!item) return;
        const idx = watchlist.findIndex(w => w.id === item.id);
        if (idx >= 0) watchlist.splice(idx, 1);
        else watchlist.unshift(item);
        localStorage.setItem("catflix_list", JSON.stringify(watchlist));
        alert(idx >= 0 ? "Listenden çıkarıldı." : "✅ İzleme Listene eklendi!");
    }

    function watchHeroTrailer() {
        const cur = heroItems.at(heroIndex);
        if (!cur) return;
        const name = cur.title || cur.name;
        window.open(`https://youtube.com{encodeURIComponent(name + " Türkçe fragman")}`, "_blank");
    }

    function addHeroToList() {
        const cur = heroItems.at(heroIndex);
        if (!cur) return;
        const key = `${cur.media_type || "movie"}_${cur.id}`;
        itemsMap[key] = cur;
        toggleWatchlistByKey(key);
    }

    function openHeroDetails() {
        const cur = heroItems.at(heroIndex);
        if (!cur) return;
        const key = `${cur.media_type || "movie"}_${cur.id}`;
        itemsMap[key] = cur;
        openDetailByKey(key);
    }

    loadHome();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATFLIX • M3U & Medya Oynatıcı</title>
    <style>
        :root { --bg: #08080c; --panel: #12121a; --red: #e50914; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: #fff; padding-bottom: 50px; }
        nav { position: fixed; top: 0; left: 0; right: 0; z-index: 40; display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: rgba(8,8,12,0.96); border-bottom: 1px solid rgba(255,255,255,0.08); gap: 10px; }
        .nav-left { display: flex; align-items: center; gap: 15px; overflow-x: auto; }
        .logo { font-size: 24px; font-weight: 900; color: var(--red); cursor: pointer; letter-spacing: 1.5px; }
        .nav-link { color: #cbd5e1; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .nav-link.active { color: #fff; border-bottom: 2px solid var(--red); }
        input[type="text"] { background: #1c1c26; border: 1px solid #333; color: #fff; padding: 8px 13px; border-radius: 10px; outline: none; font-size: 13px; }
        .m3u-panel { margin: 82px 20px 10px; background: var(--panel); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 18px; }
        .m3u-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .btn-red { background: var(--red); color: #fff; border: none; padding: 9px 16px; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 13px; }
        .btn-glass { background: rgba(255,255,255,0.14); color: #fff; border: none; padding: 9px 14px; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 13px; }
        .cat-bar { display: flex; gap: 8px; overflow-x: auto; padding: 10px 20px; }
        .cat-chip { background: #1c1c26; border: 1px solid #333; color: #cbd5e1; padding: 6px 12px; border-radius: 16px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .cat-chip.active { background: var(--red); color: #fff; border-color: var(--red); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 12px; padding: 10px 20px; }
        .card { background: var(--panel); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; overflow: hidden; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; }
        .card:hover { border-color: var(--red); transform: translateY(-2px); }
        .card-thumb { height: 110px; background: linear-gradient(135deg, #1e1b4b, #4c0519); display: flex; align-items: center; justify-content: center; position: relative; padding: 8px; }
        .card-thumb img { max-width: 80%; max-height: 85%; object-fit: contain; }
        .card-body { padding: 10px; }
        .card-group { font-size: 10px; color: #f87171; font-weight: 800; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-title { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 60; align-items: center; justify-content: center; padding: 16px; }
        .modal-box { background: var(--panel); border: 1px solid var(--red); border-radius: 14px; max-width: 860px; width: 100%; overflow: hidden; }
        video { width: 100%; max-height: 72vh; background: #000; display: block; }
    </style>
</head>
<body>
<nav>
    <div class="nav-left">
        <div class="logo" onclick="renderItems(playlist)">CATFLIX M3U</div>
        <span class="nav-link active" onclick="showTab('all', this)">Tüm Liste</span>
        <span class="nav-link" onclick="showTab('fav', this)">Favorilerim</span>
    </div>
    <input type="text" id="searchInput" placeholder="Kanal veya film ara..." oninput="filterSearch(this.value)">
</nav>

<div class="m3u-panel">
    <div style="font-size:15px;font-weight:900;margin-bottom:4px;">📡 M3U Playlist Linki Ekle veya Dosya Yükle</div>
    <div style="font-size:12px;color:#94a3b8;">Kendi .m3u / .m3u8 / .mp4 linkini yapıştır veya cihazından .m3u / video dosyası seç.</div>
    <div class="m3u-row">
        <input type="text" id="m3uUrlInput" placeholder="https://ornek.com veya .m3u8 / .mp4" style="flex:1;min-width:220px;">
        <button type="button" class="btn-red" onclick="importFromUrl()">+ Linki Ekle</button>
        <label class="btn-glass" style="cursor:pointer;">
            📂 .M3U / Video Dosyası Seç
            <input type="file" id="fileInput" accept=".m3u,.m3u8,.txt,video/*" style="display:none;" onchange="importFromFile(this)">
        </label>
        <button type="button" class="btn-glass" onclick="exportM3u()">⬇ Listeyi .M3U İndir</button>
        <button type="button" class="btn-glass" onclick="clearPlaylist()">🗑 Temizle</button>
    </div>
</div>

<div class="cat-bar" id="groupBar"></div>
<div class="grid" id="mediaGrid"></div>

<div class="modal" id="playerModal" onclick="if(event.target===this) closeModal()">
    <div class="modal-box">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.1);">
            <h3 id="pTitle" style="font-size:16px;"></h3>
            <div style="display:flex;gap:8px;">
                <a id="pDownloadBtn" class="btn-glass" download style="text-decoration:none;display:none;">⬇ Videoyu İndir</a>
                <button type="button" class="btn-red" onclick="closeModal()">✕ Kapat</button>
            </div>
        </div>
        <video id="videoPlayer" controls playsinline></video>
    </div>
</div>

<script>
    const DEFAULT_ITEMS = [
        { name: "TRT 1 (Açık Yayın)", group: "Ulusal TV", logo: "", url: "https://trt.com.tr" },
        { name: "TRT Haber (Açık Yayın)", group: "Haber", logo: "", url: "https://trt.com.tr" },
        { name: "TRT Belgesel (Açık Yayın)", group: "Belgesel", logo: "", url: "https://trt.com.tr" },
        { name: "TRT Spor (Açık Yayın)", group: "Spor", logo: "", url: "https://trt.com.tr" },
        { name: "Yaşayan Ölülerin Gecesi (1968)", group: "Sinema Klasikleri", logo: "", url: "https://archive.org" },
        { name: "Öldüren Şüphe / Charade (1963)", group: "Sinema Klasikleri", logo: "", url: "https://archive.org" }
    ];

    let playlist = JSON.parse(localStorage.getItem("catflix_m3u") || "null") || DEFAULT_ITEMS;
    let favs = JSON.parse(localStorage.getItem("catflix_favs") || "[]");
    let hls = null, activeGroup = "Tümü";

    function saveData() {
        localStorage.setItem("catflix_m3u", JSON.stringify(playlist));
        localStorage.setItem("catflix_favs", JSON.stringify(favs));
    }

    function parseM3uText(text) {
        const lines = text.split(/\r?\n/);
        const items = [];
        let cur = null;
        for (let line of lines) {
            line = line.trim();
            if (!line) continue;
            if (line.startsWith("#EXTINF:")) {
                const name = line.split(",").pop().trim() || "İsimsiz Yayın";
                const gMatch = line.match(/group-title="([^"]*)"/i);
                const lMatch = line.match(/tvg-logo="([^"]*)"/i);
                cur = { name: name, group: gMatch ? gMatch : "Genel", logo: lMatch ? lMatch : "" };
            } else if (/^(https?:|blob:)/i.test(line)) {
                if (cur) { cur.url = line; items.push(cur); cur = null; }
                else items.push({ name: line.split("/").pop().split("?"), group: "Doğrudan Link", logo: "", url: line });
            }
        }
        return items;
    }

    async function importFromUrl() {
        const url = document.getElementById("m3uUrlInput").value.trim();
        if (!url) return;
        if (/\.(mp4|mkv|webm|m3u8)(\?|$)/i.test(url)) {
            const title = prompt("Bu film veya kanal için isim yaz:", url.split("/").pop().split("?"));
            if (!title) return;
            playlist.unshift({ name: title, group: "Eklenenler", logo: "", url: url });
            saveData(); buildGroups(); renderItems(playlist);
            document.getElementById("m3uUrlInput").value = "";
            return;
        }
        for (const u of [url, "https://codetabs.com" + encodeURIComponent(url), "https://allorigins.win" + encodeURIComponent(url)]) {
            try {
                const res = await fetch(u);
                if (res.ok) {
                    const txt = await res.text();
                    const parsed = parseM3uText(txt);
                    if (parsed.length) {
                        playlist = parsed.concat(playlist);
                        saveData(); buildGroups(); renderItems(playlist);
                        document.getElementById("m3uUrlInput").value = "";
                        alert("✅ " + parsed.length + " kanal/film başarıyla eklendi!");
                        return;
                    }
                }
            } catch (e) {}
        }
        alert("Liste okunamadı. .m3u dosyasını cihazına indirip 'Dosya Seç' butonuyla da yükleyebilirsin.");
    }

    function importFromFile(input) {
        const file = input.files;
        if (!file) return;
        if (file.type.startsWith("video/")) {
            const blobUrl = URL.createObjectURL(file);
            playlist.unshift({ name: file.name, group: "Yerel Videolar", logo: "", url: blobUrl });
            saveData(); buildGroups(); renderItems(playlist);
            return;
        }
        const reader = new FileReader();
        reader.onload = function(e) {
            const parsed = parseM3uText(e.target.result);
            if (parsed.length) {
                playlist = parsed.concat(playlist);
                saveData(); buildGroups(); renderItems(playlist);
                alert("✅ Dosyadan " + parsed.length + " içerik yüklendi!");
            }
        };
        reader.readAsText(file);
    }

    function exportM3u() {
        let out = "#EXTM3U\n";
        playlist.forEach(it => { out += `#EXTINF:-1 group-title="${it.group}" tvg-logo="${it.logo || ""}",${it.name}\n${it.url}\n`; });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([out], { type: "audio/x-mpegurl" }));
        a.download = "catflix_listem.m3u";
        a.click();
    }

    function clearPlaylist() {
        if (confirm("Tüm liste sıfırlansın mı?")) {
            playlist = DEFAULT_ITEMS; saveData(); buildGroups(); renderItems(playlist);
        }
    }

    function buildGroups() {
        const groups = ["Tümü", ...new Set(playlist.map(x => x.group || "Genel"))];
        document.getElementById("groupBar").innerHTML = groups.map(g =>
            `<div class="cat-chip ${g === activeGroup ? 'active' : ''}" onclick="selectGroup('${g.replace(/'/g, "\\'")}')">${g}</div>`
        ).join("");
    }

    function selectGroup(g) {
        activeGroup = g; buildGroups();
        renderItems(g === "Tümü" ? playlist : playlist.filter(x => x.group === g));
    }

    function showTab(tab, el) {
        document.querySelectorAll(".nav-link").forEach(n => n.classList.remove("active"));
        el.classList.add("active");
        renderItems(tab === "fav" ? favs : playlist);
    }

    function filterSearch(q) {
        const t = q.trim().toLowerCase();
        renderItems(t ? playlist.filter(x => x.name.toLowerCase().includes(t)) : playlist);
    }

    function renderItems(list) {
        const grid = document.getElementById("mediaGrid");
        if (!list.length) { grid.innerHTML = '<div style="padding:20px;color:#94a3b8;">Liste boş.</div>'; return; }
        grid.innerHTML = list.map((it, idx) => {
            const isFav = favs.some(f => f.url === it.url);
            const thumb = it.logo ? `<img src="${it.logo}" onerror="this.remove()">` : `<div style="font-size:32px;">🎬</div>`;
            return `<div class="card">
                <div class="card-thumb" onclick="playStream('${it.name.replace(/'/g, "\\'")}','${it.url}')">${thumb}</div>
                <div class="card-body">
                    <div class="card-group">${it.group || "Genel"}</div>
                    <div class="card-title" onclick="playStream('${it.name.replace(/'/g, "\\'")}','${it.url}')">${it.name}</div>
                    <div style="margin-top:8px;display:flex;justify-content:space-between;">
                        <button class="btn-red" style="padding:4px 10px;font-size:11px;" onclick="playStream('${it.name.replace(/'/g, "\\'")}','${it.url}')">▶ Oynat</button>
                        <button class="btn-glass" style="padding:4px 8px;font-size:11px;" onclick="toggleFav(${idx})">${isFav ? "❤️" : "🤍"}</button>
                    </div>
                </div>
            </div>`;
        }).join("");
    }

    function toggleFav(idx) {
        const it = playlist[idx];
        if (!it) return;
        const fIdx = favs.findIndex(f => f.url === it.url);
        if (fIdx >= 0) favs.splice(fIdx, 1); else favs.unshift(it);
        saveData(); renderItems(playlist);
    }

    function playStream(name, url) {
stopPlayer();
document.getElementById("pTitle").innerText = name;
const dlBtn = document.getElementById("pDownloadBtn");
if (/.mp4(?|$)/i.test(url) || url.startsWith("blob:")) { dlBtn.style.display = "inline-block"; dlBtn.href = url; }
else { dlBtn.style.display = "none"; }
const video = document.getElementById("videoPlayer");
if (window.Hls && Hls.isSupported() && /.m3u8/i.test(url)) {
hls = new Hls(); hls.loadSource(url); hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
} else {
video.src = url; video.play().catch(() => {});
}
document.getElementById("playerModal").style.display = "flex";
}
function stopPlayer() {
const video = document.getElementById("videoPlayer");
video.pause(); video.src = "";
if (hls) { hls.destroy(); hls = null; }
}
function closeModal() { stopPlayer(); document.getElementById("playerModal").style.display = "none"; }
const s = document.createElement("script");
s.src = "unpkg.com";
document.head.appendChild(s);
buildGroups();
renderItems(playlist);
    buildGroups();
    renderItems(playlist);
</script>
</body>
</html>

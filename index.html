<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATFLIX • Sinema, Dizi ve Canlı TV Tek Platformda</title>
    <style>
        :root { --bg: #080808; --panel: #151515; --panel2: #1f1f1f; --red: #F00016; --text: #FFFFFF; --muted: #a3a3a3; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; padding-bottom: 60px; }
        nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: rgba(8,8,8,0.97); border-bottom: 1px solid rgba(255,255,255,0.08); gap: 12px; }
        .nav-left { display: flex; align-items: center; gap: 16px; overflow-x: auto; scrollbar-width: none; }
        .nav-left::-webkit-scrollbar { display: none; }
        .logo { font-size: 26px; font-weight: 900; color: var(--red); letter-spacing: 2px; text-shadow: 0 0 14px rgba(240,0,22,0.85); cursor: pointer; }
        .nav-item { font-size: 13px; font-weight: 700; color: #d4d4d4; cursor: pointer; white-space: nowrap; padding: 5px 2px; border-bottom: 2px solid transparent; }
        .nav-item:hover, .nav-item.active { color: #fff; border-bottom-color: var(--red); }
        .live-dot { display: inline-block; width: 7px; height: 7px; background: var(--red); border-radius: 50%; margin-right: 4px; box-shadow: 0 0 8px var(--red); }
        .nav-right { display: flex; align-items: center; gap: 8px; position: relative; }
        .search-box input { background: var(--panel); border: 1px solid #333; color: #fff; padding: 7px 14px; border-radius: 20px; width: 175px; font-size: 13px; outline: none; }
        .search-box input:focus { border-color: var(--red); width: 220px; }
        .suggest-box { display: none; position: absolute; top: 38px; right: 0; width: 310px; max-height: 350px; overflow-y: auto; background: var(--panel); border: 1px solid #333; border-radius: 10px; z-index: 120; }
        .suggest-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.06); cursor: pointer; font-size: 13px; }
        .suggest-item:hover { background: var(--panel2); }
        .suggest-item img { width: 34px; height: 48px; object-fit: cover; border-radius: 4px; background: #222; }
        .icon-btn { background: var(--panel); border: 1px solid #333; color: #fff; padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 700; white-space: nowrap; }
        .icon-btn:hover { border-color: var(--red); color: var(--red); }
        .hero { position: relative; min-height: 460px; padding: 115px 28px 40px; background-size: cover; background-position: center top; display: flex; flex-direction: column; justify-content: flex-end; background-image: linear-gradient(135deg, #290509, #080808); }
        .hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, rgba(8,8,8,0.96) 25%, rgba(8,8,8,0.3) 80%), linear-gradient(to top, var(--bg) 6%, transparent 60%); }
        .hero-body { position: relative; z-index: 10; max-width: 620px; }
        .hero-badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .badge-score { background: rgba(74,222,128,0.16); color: #4ade80; border: 1px solid rgba(74,222,128,0.4); padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 800; }
        .badge-tag { background: rgba(240,0,22,0.22); color: #ff4d5e; border: 1px solid rgba(240,0,22,0.5); padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; }
        .hero-title { font-size: 38px; font-weight: 900; line-height: 1.1; margin-bottom: 10px; text-transform: uppercase; }
        .hero-desc { font-size: 14px; color: #d4d4d4; line-height: 1.5; margin-bottom: 18px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }
        .btn-neon { background: var(--red); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 800; font-size: 13px; cursor: pointer; box-shadow: 0 0 16px rgba(240,0,22,0.6); }
        .btn-dark { background: rgba(255,255,255,0.14); color: #fff; border: 1px solid rgba(255,255,255,0.18); padding: 10px 16px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; }
        .page-wrap { padding-top: 72px; }
        .section { padding: 16px 24px 6px; }
        .sec-title { font-size: 17px; font-weight: 800; border-left: 4px solid var(--red); padding-left: 10px; margin-bottom: 12px; }
        .row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; }
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 14px; padding-top: 8px; }
        .card { position: relative; flex: 0 0 168px; background: var(--panel); border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.2s; }
        .grid-cards .card { flex: unset; }
        .card:hover { transform: scale(1.04); border-color: var(--red); }
        .card-poster { width: 100%; height: 245px; position: relative; background: linear-gradient(145deg, #1b1b1b, #2e060b); display: flex; align-items: flex-end; padding: 10px; }
        .card-poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .card-fallback { position: relative; z-index: 1; font-size: 13px; font-weight: 800; color: #fff; text-shadow: 0 2px 6px #000; }
        .pill-tl { position: absolute; top: 8px; left: 8px; z-index: 2; background: rgba(8,8,8,0.88); color: #4ade80; font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 5px; }
        .pill-tr { position: absolute; top: 8px; right: 8px; z-index: 2; background: var(--red); color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 5px; }
        .card-info { padding: 9px; }
        .card-title { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-sub { font-size: 11px; color: var(--muted); }
        .tv-layout { display: grid; grid-template-columns: 200px 280px 1fr; gap: 12px; padding: 14px 20px; min-height: calc(100vh - 85px); }
        .tv-box { background: var(--panel); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .tv-cat { padding: 10px 14px; font-size: 13px; font-weight: 700; color: #d4d4d4; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .tv-cat:hover, .tv-cat.active { background: rgba(240,0,22,0.18); color: #fff; border-left: 3px solid var(--red); }
        .tv-scroll { overflow-y: auto; max-height: 74vh; }
        .ch-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid rgba(255,255,255,0.06); cursor: pointer; }
        .ch-row:hover, .ch-row.active { background: var(--panel2); border-left: 3px solid var(--red); }
        .ch-logo { width: 36px; height: 36px; object-fit: contain; background: #080808; border-radius: 6px; padding: 2px; flex-shrink: 0; }
        .ch-name { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ch-epg { font-size: 11px; color: #4ade80; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 200; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
        .modal-card { background: var(--panel); border: 1px solid var(--red); border-radius: 14px; max-width: 920px; width: 100%; max-height: 92vh; overflow-y: auto; }
        video { width: 100%; max-height: 60vh; background: #000; display: block; }
        .player-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 12px; background: #101010; border-top: 1px solid #262626; }
        .p-ctrl { background: #222; color: #fff; border: 1px solid #383838; padding: 5px 9px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; }
        .p-ctrl:hover { border-color: var(--red); }
        .detail-hero { padding: 22px; background-size: cover; background-position: center; position: relative; }
        .detail-hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, var(--panel) 10%, rgba(8,8,8,0.78)); }
        .detail-content { position: relative; z-index: 2; display: flex; gap: 18px; flex-wrap: wrap; }
        .detail-poster { width: 155px; height: 230px; object-fit: cover; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); }
        .cast-row { display: flex; gap: 10px; overflow-x: auto; padding: 8px 0; }
        .cast-card { flex: 0 0 100px; background: var(--panel2); border-radius: 8px; padding: 8px; text-align: center; font-size: 11px; }
        .cast-card img { width: 58px; height: 58px; border-radius: 50%; object-fit: cover; margin-bottom: 4px; background: #333; }
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin-top: 10px; }
        .ep-card { background: var(--panel2); border: 1px solid #333; border-radius: 8px; padding: 10px; cursor: pointer; }
        .ep-card:hover { border-color: var(--red); }
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; padding: 18px 24px; }
        .box { background: var(--panel); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 16px; }
        .box h3 { font-size: 15px; margin-bottom: 10px; color: var(--red); }
        .field { width: 100%; background: #0c0c0c; border: 1px solid #333; color: #fff; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
        .alert-banner { background: rgba(240,0,22,0.18); border: 1px solid var(--red); color: #ffb3ba; padding: 10px 16px; margin: 10px 24px; border-radius: 8px; font-size: 13px; display: none; }
        @media (max-width: 900px) { .tv-layout { grid-template-columns: 1fr; } .hero-title { font-size: 26px; } }
    </style>
</head>
<body>
<nav>
    <div class="nav-left">
        <div class="logo" onclick="goPage('home')">CATFLIX</div>
        <span class="nav-item active" data-page="home" onclick="goPage('home',this)">Ana Sayfa</span>
        <span class="nav-item" data-page="movies" onclick="goPage('movies',this)">Filmler</span>
        <span class="nav-item" data-page="tv" onclick="goPage('tv',this)">Diziler</span>
        <span class="nav-item" data-page="livetv" onclick="goPage('livetv',this)"><span class="live-dot"></span>Canlı TV</span>
        <span class="nav-item" data-page="dubbed" onclick="goPage('dubbed',this)">Türkçe Dublaj</span>
        <span class="nav-item" data-page="imax" onclick="goPage('imax',this)">IMAX</span>
        <span class="nav-item" data-page="foryou" onclick="goPage('foryou',this)">Senin İçin</span>
        <span class="nav-item" data-page="watchlist" onclick="goPage('watchlist',this)">İzleme Listesi</span>
        <span class="nav-item" data-page="favorites" onclick="goPage('favorites',this)">Favoriler</span>
    </div>
    <div class="nav-right">
        <div class="search-box">
            <input type="text" id="globalSearch" placeholder="Film, dizi, oyuncu, kanal..." oninput="onSearchInput(this.value)">
            <div class="suggest-box" id="suggestBox"></div>
        </div>
        <button class="icon-btn" onclick="goPage('profile')">👤 Profil</button>
        <button class="icon-btn" onclick="goPage('settings')">⚙ Ayarlar</button>
    </div>
</nav>

<div id="errorBanner" class="alert-banner" style="margin-top:80px;"></div>
<div id="mainView"></div>

<div class="modal" id="appModal" onclick="if(event.target===this) closeModal()">
    <div class="modal-card">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#101010;border-bottom:1px solid #262626;">
            <strong id="modalTopTitle" style="font-size:15px;">CATFLIX</strong>
            <button class="btn-neon" style="padding:5px 12px;font-size:12px;" onclick="closeModal()">✕ Kapat</button>
        </div>
        <div id="modalBody"></div>
    </div>
</div>
<script>
    const STATE = {
        apiKey: localStorage.getItem("catflix_tmdb_key") || "4ef0be86342c15f9d510aef2774dfe78",
        lang: localStorage.getItem("catflix_lang") || "tr-TR",
        epgUrl: localStorage.getItem("catflix_epg_url") || "",
        m3uLists: JSON.parse(localStorage.getItem("catflix_m3u_lists") || "null") || [
            { id: "def1", name: "Türkiye Açık Yayınlar", url: "https://github.io", enabled: true }
        ],
                        channels: JSON.parse(localStorage.getItem("catflix_channels_v2") || "null") || [
            { id: "ch1", name: "NASA TV (4K Uzay)", group: "Belgesel", logo: "", url: "https://akamaized.net" },
            { id: "ch2", name: "Red Bull TV (Spor)", group: "Spor", logo: "", url: "https://akamaized.net" },
            { id: "ch3", name: "DW English (Haber)", group: "Haber", logo: "", url: "https://akamaized.net" },
            { id: "ch4", name: "France 24 (Haber)", group: "Uluslararası", logo: "", url: "https://france24.com" }
        ],


        epgMap: {},
        watchlist: JSON.parse(localStorage.getItem("catflix_watchlist") || "[]"),
        favorites: JSON.parse(localStorage.getItem("catflix_favorites") || "[]"),
        favChannels: JSON.parse(localStorage.getItem("catflix_fav_ch") || "[]"),
        history: JSON.parse(localStorage.getItem("catflix_history") || "[]"),
        progress: JSON.parse(localStorage.getItem("catflix_progress") || "{}"),
        genres: {}, cache: {}, hls: null, activeTvCat: "Tüm Kanallar", activeChannel: null, heroItem: null
    };

    function saveState() {
        localStorage.setItem("catflix_tmdb_key", STATE.apiKey);
        localStorage.setItem("catflix_lang", STATE.lang);
        localStorage.setItem("catflix_epg_url", STATE.epgUrl);
        localStorage.setItem("catflix_m3u_lists", JSON.stringify(STATE.m3uLists));
        localStorage.setItem("catflix_channels_v2", JSON.stringify(STATE.channels));
        localStorage.setItem("catflix_watchlist", JSON.stringify(STATE.watchlist));
        localStorage.setItem("catflix_favorites", JSON.stringify(STATE.favorites));
        localStorage.setItem("catflix_fav_ch", JSON.stringify(STATE.favChannels));
        localStorage.setItem("catflix_history", JSON.stringify(STATE.history));
        localStorage.setItem("catflix_progress", JSON.stringify(STATE.progress));
    }

    function showErr(msg) {
        const el = document.getElementById("errorBanner");
        if (!msg) { el.style.display = "none"; return; }
        el.innerText = "⚠️ " + msg;
        el.style.display = "block";
    }

        function imgUrl(path, size) {
        size = size || "w500";
        if (!path) return "";
        if (path.indexOf("http") === 0) return path;
        return "https://" + "image.tmdb.org" + "/t/p/" + size + path;
    }


            async function fetchSmart(url, isJson) {
        const proxies = [
            url,
            "https://" + "://codetabs.com" + encodeURIComponent(url),
            "https://" + "api.allorigins.win/raw?url=" + encodeURIComponent(url)
        ];
        for (let i = 0; i < proxies.length; i++) {
            const ctrl = new AbortController();
            const timer = setTimeout(function() { ctrl.abort(); }, 5000);
            try {
                const res = await fetch(proxies.at(i), { signal: ctrl.signal });
                clearTimeout(timer);
                if (res.ok) {
                    const txt = await res.text();
                    if (!isJson) return txt;
                    const parsed = JSON.parse(txt);
                    if (parsed && !parsed.status_code) return parsed;
                }
            } catch (e) { clearTimeout(timer); }
        }
        return null;
    }



            async function tmdb(path) {
        if (STATE.cache[path]) return STATE.cache[path];
        const sep = path.indexOf("?") !== -1 ? "&" : "?";
        const host = "https://" + "api." + "themoviedb.org/3";
        const url = host + path + sep + "api_key=" + STATE.apiKey + "&language=" + STATE.lang;
        const data = await fetchSmart(url, true);
        if (data && (data.results || data.genres || data.id)) {
            showErr("");
            STATE.cache[path] = data;
            return data;
        }
        try {
            const tvRes = await fetch("https://" + "api." + "://tvmaze.com");
            if (tvRes.ok) {
                const shows = await tvRes.json();
                showErr("");
                const mapped = {
                    results: shows.slice(0, 20).map(function(s) {
                        return {
                            id: s.id,
                            media_type: "tv",
                            name: s.name,
                            first_air_date: s.premiered || "2024",
                            vote_average: (s.rating && s.rating.average) || 8.4,
                            poster_path: (s.image && s.image.medium) || "",
                            backdrop_path: (s.image && s.image.original) || "",
                            overview: (s.summary || "").replace(/<[^>]+>/g, ""),
                            genre_ids: []
                        };
                    })
                };
                STATE.cache[path] = mapped;
                return mapped;
            }
        } catch (e) {}
        showErr("TMDB API bağlantısı kurulamadı. Ayarlar bölümünden API anahtarınızı kontrol edin.");
        return null;
    }



    async function loadGenres() {
        const res = await Promise.all([tmdb("/genre/movie/list"), tmdb("/genre/tv/list")]);
        if (res.at(0) && res.at(0).genres) res.at(0).genres.forEach(function(g) { STATE.genres[g.id] = g.name; });
        if (res.at(1) && res.at(1).genres) res.at(1).genres.forEach(function(g) { STATE.genres[g.id] = g.name; });
    }

    function genreNames(ids) {
        return (ids || []).map(function(id) { return STATE.genres[id]; }).filter(Boolean).slice(0, 3).join(" • ") || "Sinema & Dizi";
    }
    async function goPage(page, el) {
        document.querySelectorAll(".nav-item").forEach(function(n) { n.classList.remove("active"); });
        if (el) el.classList.add("active");
        else {
            const target = document.querySelector('.nav-item[data-page="' + page + '"]');
            if (target) target.classList.add("active");
        }
        const view = document.getElementById("mainView");
        view.innerHTML = '<div class="page-wrap" style="padding:110px 28px;color:#a3a3a3;">İçerikler yükleniyor...</div>';

        if (page === "home") await renderHome(view);
        else if (page === "movies") await renderMoviesPage(view);
        else if (page === "tv") await renderTvSeriesPage(view);
        else if (page === "livetv") renderLiveTvPage(view);
        else if (page === "dubbed") await renderDubbedPage(view);
        else if (page === "imax") await renderImaxPage(view);
        else if (page === "foryou") await renderForYouPage(view);
        else if (page === "watchlist") renderSavedPage(view, "İzleme Listem", STATE.watchlist);
        else if (page === "favorites") renderSavedPage(view, "Favorilerim", STATE.favorites);
        else if (page === "profile") renderProfilePage(view);
        else if (page === "settings") renderSettingsPage(view);
    }

    function cardHtml(item, forcedType) {
        const type = forcedType || item.media_type || (item.title ? "movie" : "tv");
        const title = item.title || item.name || "İsimsiz";
        const year = (item.release_date || item.first_air_date || "").slice(0, 4);
        const score = Number(item.vote_average || 0).toFixed(1);
        const poster = imgUrl(item.poster_path, "w500");
        return '<div class="card" onclick="openDetail(\'' + type + '\',' + item.id + ')">' +
            '<span class="pill-tl">★ ' + score + '</span>' +
            (year ? '<span class="pill-tr">' + year + '</span>' : '') +
            '<div class="card-poster">' +
            (poster ? '<img src="' + poster + '" loading="lazy" onerror="this.remove()">' : '') +
            '<div class="card-fallback">' + title + '</div></div>' +
            '<div class="card-info"><div class="card-title">' + title + '</div>' +
            '<div class="card-sub">' + genreNames(item.genre_ids) + '</div></div></div>';
    }

    function rowSection(title, items, forcedType) {
        if (!items || !items.length) return "";
        return '<div class="section"><div class="sec-title">' + title + '</div>' +
            '<div class="row">' + items.map(function(i) { return cardHtml(i, forcedType); }).join("") + '</div></div>';
    }

    function heroHtml(item, type) {
        if (!item) return "";
        STATE.heroItem = { item: item, type: type };
        const title = item.title || item.name || "CATFLIX";
        const year = (item.release_date || item.first_air_date || "").slice(0, 4);
        const score = Number(item.vote_average || 8.5).toFixed(1);
        const bg = imgUrl(item.backdrop_path || item.poster_path, "w1280");
        return '<div class="hero" style="' + (bg ? "background-image:url('" + bg + "')" : "") + '">' +
            '<div class="hero-body"><div class="hero-badges">' +
            '<span class="badge-score">★ ' + score + '</span>' +
            (year ? '<span class="badge-tag">' + year + '</span>' : '') +
            '<span class="badge-tag">' + genreNames(item.genre_ids) + '</span></div>' +
            '<h1 class="hero-title">' + title + '</h1>' +
            '<p class="hero-desc">' + (item.overview || "Sinema, Dizi ve Canlı TV Tek Platformda.") + '</p>' +
            '<div class="hero-actions">' +
            '<button class="btn-neon" onclick="openDetail(\'' + type + '\',' + item.id + ')">▶ Şimdi İzle</button>' +
            '<button class="btn-dark" onclick="openTrailer(\'' + type + '\',' + item.id + ',\'' + title.replace(/'/g, "") + '\')">🎬 Fragmanı İzle</button>' +
            '<button class="btn-dark" onclick="toggleList(\'watchlist\',' + item.id + ',\'' + type + '\')">+ Listeme Ekle</button>' +
            '<button class="btn-dark" onclick="openDetail(\'' + type + '\',' + item.id + ')">ⓘ Detaylar</button>' +
            '</div></div></div>';
    }

    async function renderHome(view) {
        const res = await Promise.all([
            tmdb("/trending/all/week"), tmdb("/trending/movie/week"), tmdb("/trending/tv/week"),
            tmdb("/movie/popular"), tmdb("/tv/popular"), tmdb("/movie/top_rated"),
            tmdb("/movie/now_playing"), tmdb("/movie/upcoming"),
            tmdb("/discover/movie?with_genres=28"), tmdb("/discover/movie?with_genres=12"),
            tmdb("/discover/movie?with_genres=878"), tmdb("/discover/movie?with_genres=35"),
            tmdb("/discover/movie?with_genres=27"), tmdb("/discover/movie?with_genres=18"),
            tmdb("/discover/movie?with_genres=53"), tmdb("/discover/movie?with_genres=16"),
            tmdb("/discover/movie?with_original_language=tr&sort_by=popularity.desc"),
            tmdb("/discover/tv?with_original_language=tr&sort_by=popularity.desc")
        ]);

    function drawTvChannels(list) {
        const el = document.getElementById("tvChannelList");

            return '<div class="ch-row ' + active + '" onclick="selectChannel(' + globalIdx + ')">' +
                '<img class="ch-logo" src="' + (c.logo || "") + '" onerror="this.style.visibility=\'hidden\'">' +

    function selectChannel(idx) {
        const ch = STATE.channels.at(idx);
        if (!ch) return;
        STATE.activeChannel = ch;
        document.getElementById("liveChName").innerText = ch.name;
        document.getElementById("liveChEpg").innerText = STATE.epgMap[ch.tvgId] || STATE.epgMap[ch.name] || "Canlı Yayın";
        document.getElementById("liveFavBtn").innerText = STATE.favChannels.indexOf(ch.url) !== -1 ? "❤️ Favoride" : "🤍 Favori";
        const errBox = document.getElementById("liveErrBox");
        errBox.style.display = "none";

        const video = document.getElementById("liveVideo");
        if (STATE.hls) { STATE.hls.destroy(); STATE.hls = null; }

        if (window.Hls && Hls.isSupported() && /\.m3u8/i.test(ch.url)) {
            const hls = new Hls();
            STATE.hls = hls;
            hls.loadSource(ch.url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function(_, data) {
                document.getElementById("liveQualitySel").innerHTML = '<option value="-1">Kalite: Otomatik</option>' + (data.levels || []).map(function(l, i) { return '<option value="' + i + '">' + l.height + 'p</option>'; }).join("");
                document.getElementById("liveAudioSel").innerHTML = '<option value="-1">Ses Parçası</option>' + (hls.audioTracks || []).map(function(a, i) { return '<option value="' + i + '">' + (a.name || "Ses " + (i + 1)) + '</option>'; }).join("");
                video.play().catch(function() {});
            });
            hls.on(Hls.Events.ERROR, function(_, d) {
                if (d.fatal) { errBox.innerText = "⚠️ Yayın akışı açılamadı veya desteklenmiyor."; errBox.style.display = "block"; }
            });
        } else {
            video.src = ch.url;
            video.onerror = function() { errBox.innerText = "⚠️ Desteklenmeyen yayın formatı veya erişim engeli."; errBox.style.display = "block"; };
            video.play().catch(function() {});
        }
        drawTvChannels(STATE.channels);
    }

        view.innerHTML = '<div class="page-wrap"><div class="section"><div class="sec-title">👤 Kullanıcı Profili & İzleme Geçmişi</div>' +
            '<div class="settings-grid" style="padding:10px 0;">' +
            '<div class="box"><h3>İstatistikler</h3><p style="font-size:13px;margin-bottom:6px;">İzleme Listesi: <strong>' + STATE.watchlist.length + '</strong> içerik</p>' +
            '<p style="font-size:13px;margin-bottom:6px;">Favori Film/Dizi: <strong>' + STATE.favorites.length + '</strong> içerik</p>' +
            '<p style="font-size:13px;margin-bottom:6px;">Favori TV Kanalı: <strong>' + STATE.favChannels.length + '</strong> kanal</p></div>' +
            '<div class="box"><h3>Kaldığınız Yerden Devam Edin</h3>' +
            (progList.length ? progList.map(function(p) { return '<div style="font-size:12px;padding:6px 0;border-bottom:1px solid #262626;cursor:pointer;" onclick="openDetail(\'tv\',' + p.tvId + ')">▶ Sezon ' + p.sNum + ' Bölüm ' + p.eNum + ' - ' + p.epName + '</div>'; }).join("") : '<p style="font-size:13px;color:#a3a3a3;">Henüz kayıtlı bölüm ilerlemesi yok.</p>') +
            '</div></div>' + rowSection("Son Görüntülenenler", STATE.history) + '</div></div>';
    }
    function renderSettingsPage(view) {
        view.innerHTML = '<div class="page-wrap"><div class="section"><div class="sec-title">⚙ Yönetim & Uygulama Ayarları</div></div>' +
            '<div class="settings-grid">' +
            '<div class="box"><h3>1. TMDB API & Dil Ayarları</h3><label style="font-size:12px;color:#a3a3a3;">TMDB v3 API Anahtarı:</label>' +
            '<input class="field" id="setApiKey" value="' + STATE.apiKey + '">' +
            '<label style="font-size:12px;color:#a3a3a3;">İçerik Dili:</label><select class="field" id="setLang">' +
            '<option value="tr-TR" ' + (STATE.lang === "tr-TR" ? "selected" : "") + '>Türkçe (tr-TR)</option>' +
            '<option value="en-US" ' + (STATE.lang === "en-US" ? "selected" : "") + '>English (en-US)</option></select>' +
            '<button class="btn-neon" onclick="saveApiSettings()">💾 Kaydet ve Uygula</button></div>' +
            '<div class="box"><h3>2. M3U Playlist & XMLTV / EPG Yönetimi</h3>' +
            '<input class="field" id="newM3uName" placeholder="Liste Adı (Örn: Spor & Ulusal)">' +
            '<input class="field" id="newM3uUrl" placeholder="https://ornek.com">' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;"><button class="btn-neon" onclick="addM3uSource()">+ URL Ekle & Çek</button>' +
            '<label class="btn-dark" style="cursor:pointer;">📂 .M3U Dosya Yükle<input type="file" accept=".m3u,.m3u8,.txt" style="display:none;" onchange="uploadM3uFile(this)"></label></div>' +
            '<input class="field" id="setEpgUrl" value="' + STATE.epgUrl + '" placeholder="XMLTV / EPG URL">' +
            '<button class="btn-dark" onclick="loadEpgXml()">📡 EPG Yükle</button>' +
            '<div style="margin-top:10px;max-height:140px;overflow-y:auto;">' +
            STATE.m3uLists.map(function(l, i) { return '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #262626;font-size:12px;"><span>' + l.name + '</span><button class="p-ctrl" onclick="removeM3uSource(' + i + ')">🗑 Sil</button></div>'; }).join("") +
            '</div></div>' +
            '<div class="box"><h3>3. Önbellek & Sistem</h3><p style="font-size:12px;color:#a3a3a3;margin-bottom:10px;">Toplam Yüklü Kanal: <strong>' + STATE.channels.length + '</strong></p>' +
            '<button class="btn-dark" onclick="refreshAllM3u()">🔄 Tüm M3U Listelerini Yenile</button>' +
            '<button class="btn-dark" style="margin-left:6px;" onclick="STATE.cache={};alert(\'Önbellek temizlendi.\');">🧹 Önbelleği Temizle</button></div></div></div>';
    }

    function saveApiSettings() {
        STATE.apiKey = document.getElementById("setApiKey").value.trim();
        STATE.lang = document.getElementById("setLang").value;
        STATE.cache = {}; saveState(); alert("TMDB API ayarları kaydedildi."); goPage("home");
    }

    function parseM3u(txt) {
        const lines = txt.split(/\r?\n/), out = [];
        let cur = null;
        for (let i = 0; i < lines.length; i++) {
            const l = lines.at(i).trim();
            if (!l) continue;
            if (l.indexOf("#EXTINF:") === 0) {
                const name = l.split(",").pop().trim() || "Kanal";
                const g = l.match(/group-title="([^"]*)"/i);
                const lg = l.match(/tvg-logo="([^"]*)"/i);
                const id = l.match(/tvg-id="([^"]*)"/i);
                cur = { name: name, group: g ? g.at(1) : "Türkiye", logo: lg ? lg.at(1) : "", tvgId: id ? id.at(1) : name };
            } else if (/^https?:\/\//i.test(l)) {
                if (cur) { cur.url = l; out.push(cur); cur = null; }
                else out.push({ name: l.split("/").pop().split("?").at(0), group: "Genel", logo: "", tvgId: "", url: l });
            }
        }
        return out;
    }

    async function addM3uSource() {
        const name = document.getElementById("newM3uName").value.trim() || "Özel Liste";
        const url = document.getElementById("newM3uUrl").value.trim();
        if (!url) return;
        const txt = await fetchSmart(url, false);
        if (!txt || txt.indexOf("#EXTINF:") === -1) { alert("M3U listesi okunamadı veya geçersiz."); return; }
        const parsed = parseM3u(txt);
        STATE.m3uLists.push({ id: "m_" + Date.now(), name: name, url: url, enabled: true });
        STATE.channels = parsed.concat(STATE.channels);
        saveState(); alert(parsed.length + " kanal eklendi!"); goPage("settings");
    }

    function uploadM3uFile(inp) {
        const f = inp.files.item(0);
        if (!f) return;
        const r = new FileReader();
        r.onload = function(e) {
            const parsed = parseM3u(e.target.result);
            if (parsed.length) {
                STATE.m3uLists.push({ id: "f_" + Date.now(), name: f.name, url: "Yerel Dosya", enabled: true });
                STATE.channels = parsed.concat(STATE.channels);
                saveState(); alert("Dosyadan " + parsed.length + " kanal yüklendi!"); goPage("settings");
            }
        };
        r.readAsText(f);
    }

    function removeM3uSource(idx) { STATE.m3uLists.splice(idx, 1); saveState(); goPage("settings"); }

    async function refreshAllM3u() {
        let all = [];
        for (let i = 0; i < STATE.m3uLists.length; i++) {
            const src = STATE.m3uLists.at(i);
            if (src.url && src.url.indexOf("http") === 0) {
                const txt = await fetchSmart(src.url, false);
                if (txt) all = all.concat(parseM3u(txt));
            }
        }
        if (all.length) { STATE.channels = all; saveState(); alert(all.length + " kanal güncellendi."); }
    }

    async function loadEpgXml() {
        const url = document.getElementById("setEpgUrl").value.trim();
        if (!url) return;
        STATE.epgUrl = url; saveState();
        const xmlTxt = await fetchSmart(url, false);
        if (!xmlTxt) { alert("EPG XML dosyası indirilemedi."); return; }
        const doc = new DOMParser().parseFromString(xmlTxt, "text/xml");
        doc.querySelectorAll("programme").forEach(function(p) {
            const ch = p.getAttribute("channel");
            const t = p.querySelector("title");
            if (ch && t && !STATE.epgMap[ch]) STATE.epgMap[ch] = t.textContent;
        });
        alert("EPG yayın akışı yüklendi.");
    }

    function ctrlPlay(id) { const v = document.getElementById(id); if (v) v.play(); }
    function ctrlPause(id) { const v = document.getElementById(id); if (v) v.pause(); }
    function ctrlMute(id) { const v = document.getElementById(id); if (v) v.muted = !v.muted; }
    function setSpeed(id, s) { const v = document.getElementById(id); if (v) v.playbackRate = Number(s); }
    function setHlsQuality(val) { if (STATE.hls) STATE.hls.currentLevel = Number(val); }
    function setHlsAudio(val) { if (STATE.hls) STATE.hls.audioTrack = Number(val); }
    function togglePip(id) { const v = document.getElementById(id); if (v && document.pictureInPictureEnabled) v.requestPictureInPicture().catch(function() {}); }
    function toggleFs(id) { const v = document.getElementById(id); if (v && v.requestFullscreen) v.requestFullscreen().catch(function() {}); }
    function closeModal() { document.getElementById("appModal").style.display = "none"; document.getElementById("modalBody").innerHTML = ""; }

                const hlsScript = document.createElement("script");
    hlsScript.src = "https://" + "://cloudflare.com" + "/ajax/libs/hls.js/1.5.15/hls.min.js";
    hlsScript.onload = async function() { await loadGenres(); await goPage("home"); };
    hlsScript.onerror = async function() { await loadGenres(); await goPage("home"); };
    document.head.appendChild(hlsScript);

    (async function() { await loadGenres(); await goPage("home"); })();
</script>
